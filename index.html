<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TO DO BIM</title>
<meta name="description" content="TO DO BIM : tâches, Ma journée, matrice d'Eisenhower. Compte personnel synchronisé.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TO DO BIM">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#12161D">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<style>
/* Thème « pro sombre » (un seul jeu de couleurs, assumé). Layout : app à onglets. En-tête « cartouche » (comme un cartouche de plan), vues Ma journée / Tâches / Matrice / Bord / Réglages ; barre d'onglets en bas sur téléphone. */
:root{
  --bg:#0B0E13; --surface:#12161D; --surface-2:#1A2029; --ink:#E8ECF2; --muted:#8792A4; --line:#232A35; --line-2:#2E3744;
  --accent:#3FA9FF; --accent-ink:#03111F; --accent-soft:#11253A;
  --late:#FF5C5C; --late-soft:#3A161A; --today:#FF9E45; --today-soft:#3A2412; --week:#F2C14E; --week-soft:#33280F;
  --done:#36D399; --done-soft:#0F2E22;
  --q1:#FF5C5C; --q2:#3FA9FF; --q3:#FF9E45; --q4:#8792A4;
  --s-afaire:#F2C14E; --s-encours:#3FA9FF; --s-attente:#FF9E45; --s-recurrent:#B48CFF; --s-termine:#36D399;
  --p0:#3FA9FF; --p1:#FF6B9E; --p2:#36D399; --p3:#FF9E45; --p4:#B48CFF; --p5:#2ED3E6; --p6:#E6C15A; --p7:#FF5C5C;
  --g-line:rgba(255,255,255,.055); --g-half:rgba(255,255,255,.025); --g-we:rgba(255,255,255,.025);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 12px 32px rgba(0,0,0,.5);
  --f-display:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
  --f-body:-apple-system,"SF Pro Text","Segoe UI",Arial,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html,body{overscroll-behavior-y:none}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* En-tête */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.01em;white-space:nowrap}
.brand b{color:var(--accent)}
.cartouche{display:flex;border:1.5px solid var(--ink);font-family:var(--f-mono);font-size:11px;line-height:1.15;flex-shrink:0}
.cartouche div{padding:3px 8px;border-left:1px solid var(--ink);display:flex;flex-direction:column}
.cartouche div:first-child{border-left:0}
.cartouche small{font-family:var(--f-body);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
nav.tabs{display:flex;gap:4px;margin-left:auto}
nav.tabs a{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs a:hover{background:var(--surface-2);color:var(--ink)}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--surface)}
nav.tabs svg{width:18px;height:18px;flex-shrink:0}
nav.tabs .badge{font-family:var(--f-mono);font-size:11px;background:var(--late);color:#fff;border-radius:9px;padding:0 6px;line-height:17px}

main{padding-block:20px 120px}
.view-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,4vw,34px);line-height:1.05;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:18px;margin:0}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:18px}
.kpi{background:var(--surface);padding:10px 12px;min-width:0}
.kpi .n{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted);margin-top:4px}
.kpi.late .n{color:var(--late)} .kpi.today .n{color:var(--today)} .kpi.week .n{color:var(--week)}
.kpi.enc .n{color:var(--s-encours)} .kpi.q1 .n{color:var(--q1)} .kpi.done .n{color:var(--done)}

/* Segments (filtres à boutons) */
.seg-block{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.seg-label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);min-width:68px}
.seg{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.seg .c{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.seg:hover{border-color:var(--muted)}
.seg[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.seg[aria-pressed="true"] .c{color:inherit;opacity:.75}
.seg.clear{border-style:dashed;color:var(--muted)}
.filters{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:14px}

/* Barre d'outils tâches */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.search{flex:1 1 260px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 12px;min-width:0}
.search input{border:0;background:transparent;outline:none;padding:10px 0;width:100%;min-width:0}
.search svg{width:18px;height:18px;color:var(--muted);flex-shrink:0}
.search:focus-within{border-color:var(--accent)}
select.ctl,.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:9px 12px;font-weight:500}
.btn{display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--late);border-color:var(--late)}
.btn.danger.armed{background:var(--late);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn svg{width:16px;height:16px}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:0 4px;cursor:pointer}
.toggle input{accent-color:var(--accent);width:16px;height:16px}

.quick{display:flex;gap:8px;background:var(--surface);border:1.5px dashed var(--line);border-radius:var(--r);padding:6px;margin-bottom:14px;flex-wrap:wrap}
.quick input{flex:1 1 220px;border:0;background:transparent;outline:none;padding:8px;min-width:0}
.quick select{border:0;background:var(--surface-2);border-radius:8px;padding:6px 8px;font-weight:500}
.quick:focus-within{border-color:var(--accent);border-style:solid}

/* Liste */
.group{margin-bottom:18px}
.group-h{display:flex;align-items:center;gap:10px;padding:6px 2px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);background:var(--bg);z-index:5}
.group-h h2{display:flex;align-items:center;gap:8px}
.group-h .count{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.group-h .add{margin-left:auto}
.list{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.task{display:flex;gap:10px;align-items:flex-start;background:var(--surface);padding:10px 12px;min-width:0}
.task:hover{background:color-mix(in srgb,var(--surface-2) 55%,var(--surface))}
.task.is-done .t-title{text-decoration:line-through;color:var(--muted)}
.task.hit{box-shadow:inset 3px 0 0 var(--week)}
.check{width:22px;height:22px;flex-shrink:0;margin-top:1px;border-radius:6px;border:1.5px solid var(--muted);background:transparent;display:grid;place-items:center;padding:0;color:transparent}
.check:hover{border-color:var(--done);color:var(--done)}
.check svg{width:14px;height:14px}
.is-done .check{background:var(--done);border-color:var(--done);color:#fff}
.t-main{flex:1;min-width:0;cursor:pointer;text-align:left;background:none;border:0;padding:0}
.t-title{font-weight:500;overflow-wrap:anywhere}
.t-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;align-items:center}
.t-note{font-size:12.5px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.pill{font-size:11.5px;font-weight:600;border-radius:5px;padding:1px 7px;line-height:18px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.proj{color:var(--pc);background:color-mix(in srgb,var(--pc) 13%,transparent)}
.pill.st{background:transparent;color:var(--sc);padding-left:0}
.pill.st::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--sc);margin-right:5px;vertical-align:1px}
.pill.due{font-family:var(--f-mono);font-weight:500}
.pill.late{background:var(--late);color:#fff} .pill.today{background:var(--today);color:#fff} .pill.week{background:var(--week-soft);color:var(--week)}
.pill.q{background:color-mix(in srgb,var(--qc) 14%,transparent);color:var(--qc)}
.pill.hp{color:var(--late);background:var(--late-soft)}
.pill.theme{background:transparent;padding-left:0;font-weight:500}
.pill.plan{background:var(--accent-soft);color:var(--accent);font-family:var(--f-mono);font-weight:500}
.pill.plan.late{background:var(--late-soft);color:var(--late)}
.pill.rec{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
/* Planning */
.pnav{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.segbar{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.segbar button{border:0;background:transparent;padding:8px 12px;font-weight:500;color:var(--muted)}
.segbar button+button{border-left:1px solid var(--line)}
.segbar button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.plan-layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:14px;align-items:start}
.plan-layout.annee{grid-template-columns:minmax(0,1fr)}
.backlog{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 110px);overflow:auto}
.backlog summary{list-style:none;display:flex;align-items:center;gap:8px;cursor:pointer}
.backlog summary::-webkit-details-marker{display:none}
.backlog .count{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.bl-list{display:grid;gap:6px;margin-top:8px}
.pcard{background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--pc);border-radius:8px;padding:7px 9px;cursor:grab;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.pcard .t-title{font-size:13.5px}
.pc-quick{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.pc-quick button{border:1px solid var(--line);background:var(--surface);border-radius:6px;font-size:11.5px;padding:2px 8px;font-weight:600;color:var(--accent)}
.pcal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.pwk-head{display:grid;border-bottom:1px solid var(--line);background:var(--surface-2)}
.pwk-head div{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 8px}
.pweek+.pweek{border-top:1px solid var(--line)}
.pdays{display:grid}
.pday{padding:6px 8px 4px;border-left:1px solid var(--line);min-width:0;display:flex;flex-direction:column;gap:2px}
.pday:first-child{border-left:0}
.pday.is-today{background:var(--accent-soft)}
.pday.out .pd-num{opacity:.4}
.pday.drop{background:color-mix(in srgb,var(--accent) 24%,transparent)}
.pday.we{background:var(--surface-2)}
.pd-row{display:flex;align-items:center;gap:4px;min-width:0}
.pd-num{border:0;background:none;padding:0;text-align:left;font-weight:600;font-size:12.5px;color:var(--muted);white-space:nowrap}
.pd-num b{font-family:var(--f-display);font-size:19px;font-weight:800;color:var(--ink);margin-left:3px}
.is-today .pd-num b{color:var(--accent)}
.pd-add{margin-left:auto;border:0;background:none;color:var(--muted);width:22px;height:22px;border-radius:6px;display:grid;place-items:center;padding:0}
.pd-add:hover{background:var(--line);color:var(--accent)}
.pd-add svg{width:14px;height:14px}
.pload{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pload.over{color:var(--late);font-weight:600}
.pdl{font-size:11px;color:var(--late);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;background:none;padding:0;text-align:left}
.pdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--late);margin-left:4px;vertical-align:2px}
.pgrid{display:grid;position:relative;padding:4px 0 8px;grid-auto-rows:30px;row-gap:3px;min-height:70px}
.pgrid.compact{grid-auto-rows:20px;row-gap:2px;min-height:58px;padding:2px 0 4px}
.pcell{border-left:1px solid var(--line);margin:-4px 0 -8px}
.pcell.c0{border-left:0}
.pcell.we{background:var(--surface-2)}
.pcell.td{background:color-mix(in srgb,var(--accent-soft) 70%,transparent)}
.pbar{position:relative;z-index:1;margin:0 3px;border-radius:6px;background:color-mix(in srgb,var(--pc) 17%,var(--surface));border-left:3px solid var(--pc);color:var(--ink);font-size:12.5px;font-weight:500;padding:0 18px 0 7px;display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap;cursor:grab;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;min-width:0;text-align:left}
.compact .pbar{font-size:11px;padding:0 12px 0 5px;border-left-width:2px;border-radius:4px}
.pbar .pb-t{overflow:hidden;text-overflow:ellipsis}
.pbar .pb-h{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);margin-left:auto;flex-shrink:0}
.pbar.cutL{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:0}
.pbar.cutR{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:0;padding-right:7px}
.pbar.done{opacity:.5}
.pbar.done .pb-t{text-decoration:line-through}
.pbar.late{box-shadow:inset 0 0 0 1.5px var(--late)}
.pbar.rec{background:transparent;border:1px dashed var(--pc);border-left:3px solid var(--pc);cursor:pointer;padding-right:7px}
.pbar.dragging,.pcard.dragging{opacity:.35}
.pb-rz{position:absolute;right:0;top:0;bottom:0;width:16px;cursor:ew-resize;touch-action:none;display:flex;align-items:center;justify-content:center}
.pb-rz::after{content:"";width:3px;height:50%;border-left:1.5px solid var(--muted);border-right:1.5px solid var(--muted);opacity:.7}
.compact .pb-rz{width:11px}
.pmore{border:0;background:none;font-size:11px;color:var(--muted);text-align:left;padding:0 6px;font-weight:600;z-index:1}
.pghost{position:fixed;left:0;top:0;z-index:200;pointer-events:none;background:var(--ink);color:var(--surface);padding:6px 10px;border-radius:8px;font-size:13px;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:var(--shadow)}
body.is-dragging{-webkit-user-select:none;user-select:none;cursor:grabbing}
.psum{display:flex;gap:16px;flex-wrap:wrap;padding:10px 12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.psum b{color:var(--ink);font-variant-numeric:tabular-nums}
.yr-wrap{overflow-x:auto;padding:10px}
table.yr{border-collapse:separate;border-spacing:2px;font-size:11px;font-variant-numeric:tabular-nums}
.yr th{font-weight:600;color:var(--muted);font-size:10.5px;padding:0 2px;text-align:center}
.yr th.m{text-align:left;padding-right:8px;font-size:12px;color:var(--ink);white-space:nowrap}
.yr td{width:20px;height:20px;border-radius:4px;background:var(--surface-2);position:relative;padding:0}
.yr td button{position:absolute;inset:0;border:0;background:transparent;border-radius:4px;padding:0}
.yr td.na{background:transparent}
.yr td.we{background:color-mix(in srgb,var(--surface-2) 50%,var(--bg))}
.yr td.l1{background:color-mix(in srgb,var(--accent) 22%,var(--surface))}
.yr td.l2{background:color-mix(in srgb,var(--accent) 45%,var(--surface))}
.yr td.l3{background:color-mix(in srgb,var(--accent) 70%,var(--surface))}
.yr td.l4{background:var(--accent)}
.yr td.td{outline:2px solid var(--ink);outline-offset:-1px}
.yr td.dl::after{content:"";position:absolute;right:2px;top:2px;width:5px;height:5px;border-radius:50%;background:var(--late)}
.yr td.n{width:auto;background:none;color:var(--muted);font-family:var(--f-mono);padding-left:8px;white-space:nowrap}
.yr-leg{display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:12px;color:var(--muted);padding:0 12px 12px}
.yr-leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-2px}
.plan-box{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:12px;background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.plan-box .ttl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.field input[type=number]{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
.segc.days button{min-width:34px}
.reason{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;width:92px;flex-shrink:0;padding-top:3px}
.reason.plan{color:var(--accent)} .reason.late{color:var(--late)} .reason.today{color:var(--today)} .reason.week{color:var(--week)} .reason.q1{color:var(--q1)} .reason.enc{color:var(--s-encours)}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted)}
.empty h2{color:var(--ink);margin-bottom:6px}
.empty .actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.notice{background:var(--week-soft);color:var(--ink);border-radius:var(--r);padding:10px 14px;font-size:13.5px;margin-bottom:14px}

/* Matrice */
.matrix{display:grid;grid-template-columns:28px 1fr 1fr;grid-template-rows:auto 1fr 1fr;gap:10px}
.axis{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:center}
.axis.v{writing-mode:vertical-rl;transform:rotate(180deg)}
.quad{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--qc);border-radius:var(--r);padding:10px;min-height:180px;min-width:0;display:flex;flex-direction:column;gap:6px;transition:background .15s}
.quad.over{background:color-mix(in srgb,var(--qc) 10%,var(--surface))}
.quad-h{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.quad-h h2{color:var(--qc)}
.quad-h span{font-size:12px;color:var(--muted)}
.quad-h .count{margin-left:auto;font-family:var(--f-mono);font-size:13px;color:var(--qc)}
.card{display:flex;gap:8px;align-items:flex-start;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;cursor:grab;min-width:0}

/* Gantt */

.tip{position:fixed;left:0;top:0;z-index:300;width:max-content;min-width:300px;max-width:min(400px,calc(100vw - 20px));background:var(--surface);border:1px solid color-mix(in srgb,var(--pc) 60%,var(--line-2));border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.75),0 0 0 1px rgba(0,0,0,.35),0 0 34px color-mix(in srgb,var(--pc) 30%,transparent);pointer-events:none;opacity:0;transform:translateY(6px) scale(.98);transform-origin:top center;transition:opacity .14s ease,transform .14s ease;font-size:13.5px;line-height:1.45;color:var(--ink)}

.tip.tip-sheet{left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));top:auto!important;bottom:calc(env(safe-area-inset-bottom,0px) + 80px);width:auto;min-width:0;max-width:560px;margin:0 auto;max-height:72vh;overflow-y:auto;pointer-events:auto;border-radius:18px;transform:translateY(24px);font-size:15px}

/* Comptes + synchronisation (Firebase). Chaque utilisateur ne lit et n'écrit que users/<son uid>/... */
(function(){
  "use strict";
  var cfg = window.FIREBASE_CONFIG || (typeof firebaseConfig !== "undefined" ? firebaseConfig : null);
  var configured = !!(cfg && cfg.apiKey && !/REMPLACER/.test(cfg.apiKey) && cfg.projectId && !/REMPLACER/.test(cfg.projectId));
  var F = window.FB;
  var app = null, auth = null, fs = null;
  if (configured && F) {
    try {
      app = F.initializeApp(cfg);
      auth = F.initializeAuth(app, {persistence:[F.indexedDBLocalPersistence, F.browserLocalPersistence]});
      try { fs = F.initializeFirestore(app, {localCache: F.persistentLocalCache({tabManager: F.persistentMultipleTabManager()})}); }
      catch (e) { fs = F.initializeFirestore(app, {}); }
    } catch (e) { console.error(e); configured = false; }
  }

  /* ---- Adaptateur : même interface que le stockage de l'app ---- */
  function wrapDoc(s){ return {id:s.id, exists:s.exists(), data:function(){ return s.data(); }, metadata:{fromCache:s.metadata.fromCache, hasPendingWrites:s.metadata.hasPendingWrites}}; }
  function soft(p){ p.catch(function(e){ console.warn("Écriture refusée", e); }); return Promise.race([p, new Promise(function(r){ setTimeout(r, 1200); })]); }
  function mapErr(e){ var err = new Error(e && e.message || "erreur"); err.code = e && e.code === "permission-denied" ? "invalid_argument" : e && e.code === "resource-exhausted" ? "quota_exceeded" : "unavailable"; return err; }
  function makeDb(uid){
    function ref(path){ var p = path.split("/"); return F.doc(fs, "users", uid, p[0], p[1]); }
    function wrapRef(r){
      return {
        id:r.id, path:r.path,
        set:function(d){ return soft(F.setDoc(r, d)).catch(function(e){ throw mapErr(e); }); },
        update:function(d){ return soft(F.updateDoc(r, d)).catch(function(e){ throw mapErr(e); }); },
        delete:function(){ return soft(F.deleteDoc(r)).catch(function(e){ throw mapErr(e); }); },
        onSnapshot:function(next, error){ return F.onSnapshot(r, {includeMetadataChanges:true}, function(s){ next(wrapDoc(s)); }, function(e){ error && error({code:"revoked", message:String(e && e.message)}); }); }
      };
    }
    return {
      doc:function(path){ return wrapRef(ref(path)); },
      collection:function(name){
        var c = F.collection(fs, "users", uid, name);
        return {
          path:name,
          doc:function(id){ return wrapRef(id ? F.doc(c, id) : F.doc(c)); },
          onSnapshot:function(next, error){
            return F.onSnapshot(c, {includeMetadataChanges:true}, function(qs){
              var docs = qs.docs.map(wrapDoc);
              next({docs:docs, size:docs.length, empty:!docs.length, metadata:{fromCache:qs.metadata.fromCache, hasPendingWrites:qs.metadata.hasPendingWrites}, docChanges:function(){ return []; }});
            }, function(e){ error && error({code:"revoked", message:String(e && e.message)}); });
          }

    };

  /* ---- Export de fichiers (feuille de partage iOS / téléchargement Mac) ---- */
  var MIME = {json:"application/json", csv:"text/csv", xlsx:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"};
  var downloads = {
    save:function(req){
      var ext = (req.filename.split(".").pop() || "").toLowerCase();
      var blob = new Blob([req.data], {type:MIME[ext] || "application/octet-stream"});
      try {
        var file = new File([blob], req.filename, {type:blob.type});
        var mobile = /iPhone|iPad|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.userAgent));
        if (mobile && navigator.canShare && navigator.canShare({files:[file]})) {

        }
      } catch (e) {}
      var url = URL.createObjectURL(blob), a = document.createElement("a");
      a.href = url; a.download = req.filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);

  };

  /* ---- Écran de connexion ---- */
  var resolveDb, dbPromise = new Promise(function(r){ resolveDb = r; });
  var ERR = {
    "auth/invalid-credential":"E-mail ou mot de passe incorrect.", "auth/wrong-password":"E-mail ou mot de passe incorrect.", "auth/user-not-found":"Aucun compte avec cet e-mail. Crée-le avec « Créer un compte ».",
    "auth/invalid-email":"Adresse e-mail invalide.", "auth/email-already-in-use":"Un compte existe déjà avec cet e-mail : connecte-toi.", "auth/weak-password":"Mot de passe trop court : 6 caractères minimum.",
    "auth/network-request-failed":"Pas de connexion internet. La première connexion doit se faire en ligne.", "auth/too-many-requests":"Trop d'essais. Réessaie dans quelques minutes.",
    "auth/operation-not-allowed":"La connexion par e-mail n'est pas activée dans Firebase (étape 2 du guide).", "auth/missing-password":"Saisis ton mot de passe."
  };

  function gate(){
    var g = document.getElementById("auth-gate"); if (g) return g;
    g = el('<div id="auth-gate" class="auth"><div class="auth-card"></div></div>'); document.body.appendChild(g); return g;
  }
  function showConfigMissing(){
    gate().firstChild.innerHTML = '<div class="brand">TO DO <b>BIM</b></div><h1>Configuration à terminer</h1><p class="sub">Le fichier <b>config.js</b> ne contient pas encore la configuration Firebase. Ouvre-le sur GitHub, colle le bloc <code>const firebaseConfig = {…};</code> copié depuis Firebase, puis enregistre (étape 8 du guide).</p>';
  }
  function showLogin(mode){
    var create = mode === "create";
    var c = gate().firstChild;
    c.innerHTML = '<div class="brand">TO DO <b>BIM</b></div>'
      + '<h1>' + (create ? "Créer un compte" : "Connexion") + '</h1>'
      + '<p class="sub">' + (create ? "Tes tâches seront enregistrées dans ce compte et synchronisées sur tous tes appareils." : "Connecte-toi pour retrouver tes tâches sur cet appareil.") + '</p>'
      + '<form id="auth-form" novalidate>'
      + '<label class="field"><span class="lbl">E-mail</span><input id="auth-email" type="email" autocomplete="username" inputmode="email" autocapitalize="off" required></label>'
      + '<label class="field"><span class="lbl">Mot de passe</span><input id="auth-pass" type="password" autocomplete="' + (create ? "new-password" : "current-password") + '" required minlength="6"></label>'
      + '<p class="auth-err" id="auth-err" role="alert"></p>'
      + '<button class="btn primary" type="submit" id="auth-go">' + (create ? "Créer mon compte" : "Se connecter") + '</button>'
      + '</form>'
      + '<div class="auth-links">' + (create ? '<button class="btn ghost" data-auth="login">J\'ai déjà un compte</button>' : '<button class="btn ghost" data-auth="create">Créer un compte</button><button class="btn ghost" data-auth="reset">Mot de passe oublié ?</button>') + '</div>';
    var form = c.querySelector("#auth-form"), errEl = c.querySelector("#auth-err");
    form.addEventListener("submit", function(ev){
      ev.preventDefault();
      var email = c.querySelector("#auth-email").value.trim(), pass = c.querySelector("#auth-pass").value;
      errEl.textContent = ""; var btn = c.querySelector("#auth-go"); btn.disabled = true;
      (create ? F.createUserWithEmailAndPassword(auth, email, pass) : F.signInWithEmailAndPassword(auth, email, pass))
        .catch(function(e){ errEl.textContent = ERR[e && e.code] || ("Connexion impossible (" + (e && e.code || "erreur") + ")."); btn.disabled = false; });
    });
    c.querySelectorAll("[data-auth]").forEach(function(b){ b.addEventListener("click", function(){
      var k = b.getAttribute("data-auth");
      if (k === "reset") {
        var email = c.querySelector("#auth-email").value.trim();
        if (!email) { errEl.textContent = "Saisis ton e-mail ci-dessus, puis touche « Mot de passe oublié ? »."; return; }
        F.sendPasswordResetEmail(auth, email).then(function(){ errEl.textContent = "E-mail de réinitialisation envoyé (vérifie aussi les spams)."; }, function(e){ errEl.textContent = ERR[e && e.code] || "Envoi impossible."; });
        return;
      }
      showLogin(k);
    }); });
  }
  var started = false;
  function boot(){
    if (!configured) { showConfigMissing(); return; }
    F.onAuthStateChanged(auth, function(user){
      if (user) {
        var g = document.getElementById("auth-gate"); if (g) g.remove();
        window.TODO_ACCOUNT = {email:user.email, signOut:function(){ return F.signOut(auth).then(function(){ location.hash = "#jour"; location.reload(); }); }};
        if (!started) { started = true; resolveDb(makeDb(user.uid)); }
      } else {
        if (started) { location.reload(); return; }
        showLogin("login");
      }
    });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();

  window.claude = {use:function(name){ return name === "db" ? dbPromise : Promise.resolve(name === "downloads" ? downloads : null); }};
})();

</script>

try { S.backupAt = localStorage.getItem("todobim.backupAt") || ""; } catch (e) {}
try { const saved = JSON.parse(localStorage.getItem("todobim.ui") || "null");
  if (saved) { Object.assign(S.f, saved.f || {}); S.f.q = ""; S.jourProjet = saved.jourProjet || ""; S.matProjet = saved.matProjet || ""; S.lastProjet = saved.lastProjet || ""; if (saved.plan) Object.assign(S.plan, saved.plan); if (S.plan.mode !== "agenda" && S.plan.mode !== "gantt") S.plan.mode = "agenda"; } } catch (e) {}

const $ = (s, r = document) => r.querySelector(s);

const z2 = n => String(n).padStart(2, "0");

/* ---------- Rendu de morceaux ---------- */
function pills(t, opts = {}){

  else if (t.heures && !opts.noPlan) out.push(`<span class="pill plan">${String(t.heures).replace(".", ",")} h</span>`);
  if (blocsOf(t).length && !opts.noPlan) out.push(`<span class="pill plan">⏱ ${hfmt(schedMin(t) / 60)} h placées</span>`);
  if (Array.isArray(t.jours) && t.jours.length) out.push(`<span class="pill rec">chaque ${t.jours.slice().sort((x, y) => ((x + 6) % 7) - ((y + 6) % 7)).map(n => JOURS_COURTS[n]).join(", ")}</span>`);
  if (t.responsable && opts.resp) out.push(`<span class="pill">${esc(t.responsable)}</span>`);
  if (isDone(t) && validYmd(t.cloture)) out.push(`<span class="pill">clôturée ${fmt(t.cloture)}</span>`);
  return out.join("");
}
function taskRow(t, extra = ""){
  return `<article class="task${isDone(t) ? " is-done" : ""}" data-id="${esc(t.id)}">
    ${S.canWrite === false ? "" : `<button class="check" data-act="done" aria-label="${isDone(t) ? "Rouvrir" : "Marquer terminée"}">${I.check}</button>`}

  </article>`;
}
function segBtn(attr, val, label, pressed, count){
  return `<button class="seg" data-seg="${attr}" data-val="${esc(val)}" aria-pressed="${pressed}">${esc(label)}${count != null ? ` <span class="c">${count}</span>` : ""}</button>`;

    <div class="ta-list">${its.map(it => `<button class="ta-row${nm >= it.s && nm < it.e ? " now" : nm >= it.e ? " past" : ""}" data-id="${esc(it.t.id)}" data-act="edit" style="--pc:${projColor(it.t.projet)}"><span class="tm">${hhmm(it.s)} – ${hhmm(it.e)}</span><span class="tt">${isDone(it.t) ? "✓ " : ""}${esc(it.t.tache)}</span><span class="tp">${esc(it.t.projet || "")}</span></button>`).join("")}</div></section>`;
}
function viewJour(){
  const all = live();
  const pf = S.jourProjet;
  const scope = pf ? all.filter(t => t.projet === pf) : all;
  const items = scope.filter(t => score(t) > 0).sort((a, b) => score(b) - score(a) || byDue(a, b));
  const c = k => scope.filter(t => alerte(t) === k).length;
  const now = new Date();
  const doneToday = scope.filter(t => isDone(t) && t.cloture === today()).length;
  const kpis = [
    ["late", c("late"), "En retard"], ["today", c("today"), "Aujourd'hui"], ["week", c("week"), "Sous 7 jours"],
    ["enc", scope.filter(t => planState(t) === "today" || recToday(t)).length, "Planifiées aujourd'hui"], ["q1", scope.filter(t => quadrant(t) === "Faire").length, "Quadrant Faire"],
    ["done", doneToday, "Terminées aujourd'hui"],
  ];
  const reasonOf = t => { const a = alerte(t);
    const ps = planState(t);
    return a === "late" ? ["late", "En retard"] : a === "today" ? ["today", "Aujourd'hui"] : ps === "late" ? ["late", "Planning dépassé"] : ps === "today" ? ["plan", firstBlockToday(t) ? "À " + hhmm(firstBlockToday(t).s) : "Planifiée"] : recToday(t) ? ["plan", "Récurrent"] : a === "week" ? ["week", "Sous 7 j"] : quadrant(t) === "Faire" ? ["q1", "Faire"] : ["enc", "En cours"]; };
  const projBtns = [segBtn("jour", "", "Tous", !pf), ...allProjets().map(p => segBtn("jour", p, p, pf === p, all.filter(t => t.projet === p && score(t) > 0).length))].join("");
  return `<div class="jour">
    <div class="view-head"><div><div class="eyebrow">Semaine ${isoWeek(now)}</div><h1>${JOURS[now.getDay()]} ${now.getDate()} ${MOIS[now.getMonth()]}</h1>
      <div class="sub">En retard, planifié aujourd'hui, dû bientôt, quadrant « Faire » et en cours. Trié par urgence, priorité puis échéance.</div></div></div>
    <div class="kpis">${kpis.map(([k, n, l]) => `<div class="kpi ${k}"><div class="n">${n}</div><div class="l">${l}</div></div>`).join("")}</div>
    ${todayAgenda(pf)}
    <div class="seg-block" style="margin-bottom:14px"><span class="seg-label">Projet</span>${projBtns}</div>
    ${!all.length ? emptyState() : items.length ? `<div class="list">${items.map(t => { const [k, l] = reasonOf(t); return taskRow(t, `<span class="reason ${k}">${l}</span>`); }).join("")}</div>`
      : `<div class="empty"><h2>Rien d'urgent</h2><p>Aucune tâche en retard, due cette semaine ou classée « Faire »${pf ? " pour " + esc(pf) : ""}. Regarde le quadrant « Planifier » de la Matrice.</p><div class="actions"><a class="btn" href="#matrice">Ouvrir la Matrice</a></div></div>`}
  </div>`;
}

    </select>
  </div>

function filteredTasks(){
  const f = S.f;
  let arr = [...S.tasks.values()].filter(t => f.showArch ? true : !t.archived);
  if (f.hideDone) arr = arr.filter(t => !isDone(t));
  if (f.projets.length) arr = arr.filter(t => f.projets.includes(t.projet || ""));
  if (f.statuts.length) arr = arr.filter(t => f.statuts.includes(t.statut));
  if (f.quads.length) arr = arr.filter(t => f.quads.includes(quadrant(t) || "—"));
  const words = norm(f.q).split(/\s+/).filter(Boolean);
  if (words.length) arr = arr.filter(t => { const hay = norm([t.projet, t.tache, t.theme, t.responsable, t.commentaires, t.type, t.statut].join(" ")); return words.every(w => hay.includes(w)); });
  const po = allProjets(), so = STATUTS, pr = {Haute:0, Moyenne:1, Basse:2};
  const sorters = {
    projet: (a, b) => po.indexOf(a.projet) - po.indexOf(b.projet) || so.indexOf(a.statut) - so.indexOf(b.statut) || byDue(a, b),
    echeance: byDue,
    priorite: (a, b) => (pr[a.priorite] ?? 3) - (pr[b.priorite] ?? 3) || byDue(a, b),
    statut: (a, b) => so.indexOf(a.statut) - so.indexOf(b.statut) || byDue(a, b),
    recent: (a, b) => (b.updated || "").localeCompare(a.updated || ""),
  };
  return arr.sort(sorters[f.sort] || sorters.projet);
}
function updateTaches(){
  const f = S.f, base = [...S.tasks.values()].filter(t => (f.showArch || !t.archived) && (!f.hideDone || !isDone(t)));
  const cnt = (fn) => base.filter(fn).length;
  const segs = [
    `<div class="seg-block"><span class="seg-label">Projet</span>${allProjets().map(p => segBtn("projets", p, p, f.projets.includes(p), cnt(t => t.projet === p))).join("")}</div>`,
    `<div class="seg-block"><span class="seg-label">Statut</span>${STATUTS.filter(s => !(f.hideDone && s === "Terminé")).map(s => segBtn("statuts", s, s, f.statuts.includes(s), cnt(t => t.statut === s))).join("")}</div>`,
    `<div class="seg-block"><span class="seg-label">Quadrant</span>${QUADS.map(q => segBtn("quads", q.k, q.label, f.quads.includes(q.k), cnt(t => quadrant(t) === q.k))).join("")}${segBtn("quads", "—", "Non classé", f.quads.includes("—"), cnt(t => !quadrant(t)))}</div>`,
    `<div class="seg-block"><span class="seg-label">Affichage</span>
      <label class="toggle"><input type="checkbox" id="t-hide" ${f.hideDone ? "checked" : ""}> Masquer les terminées</label>
      <label class="toggle"><input type="checkbox" id="t-arch" ${f.showArch ? "checked" : ""}> Voir les archives</label>
      ${(f.projets.length || f.statuts.length || f.quads.length || f.q) ? `<button class="seg clear" data-act="clear-filters">Effacer les filtres</button>` : ""}</div>`,
  ];
  $("#t-segs").innerHTML = segs.join("");
  const list = filteredTasks();
  $("#t-sub").textContent = `${list.length} tâche${list.length > 1 ? "s" : ""} affichée${list.length > 1 ? "s" : ""} sur ${S.tasks.size}`;
  const el = $("#t-list");
  if (!S.tasks.size) { el.innerHTML = emptyState(); return; }
  if (!list.length) { el.innerHTML = `<div class="empty"><h2>Aucun résultat</h2><p>Aucune tâche ne correspond à ces filtres.</p><div class="actions"><button class="btn" data-act="clear-filters">Effacer les filtres</button></div></div>`; return; }
  if (f.sort === "projet") {
    const groups = new Map();
    for (const t of list) { const k = t.projet || "Sans projet"; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(t); }
    el.innerHTML = [...groups].map(([p, ts]) => `<section class="group"><div class="group-h"><h2><span class="pill proj" style="--pc:${projColor(p)};font-size:14px">${esc(p)}</span></h2><span class="count">${ts.length}</span>
      ${S.canWrite === false ? "" : `<button class="btn ghost add" data-act="new" data-proj="${esc(p)}">${I.plus} Ajouter</button>`}</div>
      <div class="list">${ts.map(t => taskRow(t)).join("")}</div></section>`).join("");
    el.querySelectorAll(".task .pill.proj").forEach(n => n.remove());
  } else {
    el.innerHTML = `<div class="list">${list.map(t => taskRow(t)).join("")}</div>`;
  }
}

/* Matrice */
function viewMatrice(){
  const pf = S.matProjet;
  const scope = live().filter(t => !isDone(t) && t.statut !== "Récurrent" && (!pf || t.projet === pf));
  const card = t => `<div class="card" draggable="${S.canWrite !== false}" data-id="${esc(t.id)}">
      <button class="t-main" data-act="edit"><div class="t-title">${esc(t.tache)}</div><div class="t-meta">${pills(t, {noQuad:true, noTheme:true})}</div></button></div>`;
  const quad = q => { const ts = scope.filter(t => quadrant(t) === q.k).sort(byDue);
    return `<section class="quad" data-quad="${q.k}" style="--qc:var(${q.v})"><div class="quad-h"><h2>${q.label}</h2><span>${q.hint}</span><span class="count">${ts.length}</span></div>
      ${ts.map(card).join("") || `<p class="sub">Glisse une tâche ici.</p>`}</section>`; };
  const uncl = scope.filter(t => !quadrant(t)).sort(byDue);
  const projBtns = [segBtn("mat", "", "Tous", !pf), ...allProjets().map(p => segBtn("mat", p, p, pf === p))].join("");
  return `<div class="view-head"><div><h1>Matrice d'Eisenhower</h1><div class="sub">Glisse une tâche d'un quadrant à l'autre (ordinateur), ou touche-la pour choisir Urgent / Important.</div></div></div>

      <div class="axis v">Pas important</div>${quad(QUADS[2])}${quad(QUADS[3])}
    </div>
    ${uncl.length ? `<div class="tray"><section class="quad" data-quad="—" style="--qc:var(--muted)"><div class="quad-h"><h2>Non classées</h2><span>Urgent / Important pas encore renseignés</span><span class="count">${uncl.length}</span></div>
      <div class="cards">${uncl.map(t => `<div class="card" draggable="${S.canWrite !== false}" data-id="${esc(t.id)}"><div style="flex:1;min-width:0"><button class="t-main" data-act="edit"><div class="t-title">${esc(t.tache)}</div><div class="t-meta">${pills(t, {noTheme:true})}</div></button>
        ${S.canWrite === false ? "" : `<div class="qpick">${QUADS.map(q => `<button data-act="setq" data-q="${q.k}" style="--qc:var(${q.v})">${q.label}</button>`).join("")}</div>`}</div></div>`).join("")}</div></section></div>` : ""}`}`;

/* Tableau de bord */
function viewBord(){
  const all = live(), t0 = today();
  const k = [
    ["", all.filter(t => !isDone(t)).length, "Ouvertes"], ["late", all.filter(t => alerte(t) === "late").length, "En retard"],
    ["week", all.filter(t => ["today", "week"].includes(alerte(t))).length, "Échéance ≤ 7 j"],
    ["done", [...S.tasks.values()].filter(t => isDone(t) && validYmd(t.cloture) && diffDays(t0, t.cloture) <= 7).length, "Terminées (7 j)"],
    ["done", [...S.tasks.values()].filter(t => isDone(t) && validYmd(t.cloture) && diffDays(t0, t.cloture) <= 30).length, "Terminées (30 j)"],
    ["", all.filter(t => !isDone(t) && t.statut !== "Récurrent" && !validYmd(t.echeance)).length, "Sans échéance"],
  ];
  const rows = allProjets().map(p => { const ts = all.filter(t => t.projet === p); const by = s => ts.filter(t => t.statut === s).length;
    const nonRec = ts.length - by("Récurrent"); const pct = nonRec ? Math.round(by("Terminé") / nonRec * 100) : 0;
    return {p, ts, by, pct, late: ts.filter(t => alerte(t) === "late").length, q1: ts.filter(t => quadrant(t) === "Faire").length}; }).filter(r => r.ts.length);
  const cell = n => `<td class="${n ? "" : "z"}">${n}</td>`;
  const table = `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Projet</th><th>Ouvertes</th>${STATUTS.map(s => `<th>${s}</th>`).join("")}<th>Retard</th><th>Faire</th><th>Avancement</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td><span class="pill proj" style="--pc:${projColor(r.p)};font-size:13px">${esc(r.p)}</span></td>${cell(r.ts.length - r.by("Terminé"))}${STATUTS.map(s => cell(r.by(s))).join("")}
      <td class="${r.late ? "warn" : "z"}">${r.late}</td>${cell(r.q1)}<td><div class="prog"><i><b style="width:${r.pct}%"></b></i>${r.pct}%</div></td></tr>`).join("")}
    </tbody></table></div>`;
  const stack = `<div style="display:grid;gap:10px;margin-top:8px">${rows.map(r => `<div style="display:grid;grid-template-columns:80px 1fr;gap:10px;align-items:center;font-size:13px"><span>${esc(r.p)}</span>
      <div class="stack">${STATUTS.map(s => r.by(s) ? `<span title="${s} : ${r.by(s)}" style="width:${r.by(s) / r.ts.length * 100}%;background:var(${ST_VAR[s]})"></span>` : "").join("")}</div></div>`).join("")}</div>
    <div class="legend">${STATUTS.map(s => `<span><i style="background:var(${ST_VAR[s]})"></i>${s}</span>`).join("")}</div>`;
  const open = all.filter(t => !isDone(t));
  const qmax = Math.max(1, ...QUADS.map(q => open.filter(t => quadrant(t) === q.k).length));
  const qb = `<div class="qbars">${QUADS.map(q => { const n = open.filter(t => quadrant(t) === q.k).length; return `<div class="qbar" style="--qc:var(${q.v})"><span>${q.label}</span><i><b style="width:${n / qmax * 100}%"></b></i><span>${n}</span></div>`; }).join("")}
    <div class="qbar" style="--qc:var(--muted)"><span>Non classé</span><i><b style="width:${open.filter(t => !quadrant(t) && t.statut !== "Récurrent").length / qmax * 100}%"></b></i><span>${open.filter(t => !quadrant(t) && t.statut !== "Récurrent").length}</span></div></div>`;
  return `<div class="view-head"><div><h1>Tableau de bord</h1><div class="sub">Calculé en direct à partir de tes tâches (hors archives).</div></div></div>
    <div class="kpis">${k.map(([c, n, l]) => `<div class="kpi ${c}"><div class="n">${n}</div><div class="l">${l}</div></div>`).join("")}</div>
    ${!rows.length ? emptyState() : `<div class="panel" style="margin-bottom:14px"><h2>Par projet</h2>${table}</div>
    <div class="grid2"><div class="panel"><h2>Répartition des statuts</h2>${stack}</div><div class="panel"><h2>Tâches ouvertes par quadrant</h2>${qb}</div></div>`}`;
}

/* ---------- Planning : Agenda horaire + Gantt ---------- */
const JOURS_COURTS = ["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"];
const JLETTRES = [[1,"L"],[2,"M"],[3,"M"],[4,"J"],[5,"V"],[6,"S"],[0,"D"]];
const MOIS_COURTS = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const mondayOf = s => addDays(s, -((parseYmd(s).getDay() + 6) % 7));
const isWe = s => { const g = parseYmd(s).getDay(); return g === 0 || g === 6; };
const hfmt = h => String(Math.round(h * 10) / 10).replace(".", ",");
const isMobile = () => window.matchMedia && window.matchMedia("(max-width:820px)").matches;
const capDay = () => { const c = Number(S.plan.cap); return isFinite(c) && c > 0 ? c : 7.5; };
const hhmm = m => `${Math.floor(m / 60)}:${z2(Math.round(m % 60))}`;
const hhmm2 = m => `${z2(Math.floor(m / 60))}:${z2(Math.round(m % 60))}`;
const toMin = s => { const p = String(s || "").split(":").map(Number); return isFinite(p[0]) ? p[0] * 60 + (p[1] || 0) : NaN; };
const nowMin = () => { const n = new Date(); return n.getHours() * 60 + n.getMinutes(); };
const AG_H = 52;  // hauteur d'une heure dans l'agenda (px)
/* capacité de travail par jour de semaine (0 = dimanche … 6 = samedi), synchronisée dans meta/prefs */
function capsAll(){
  const c = (S.prefs && S.prefs.caps) || {}, base = Number(S.plan.cap) > 0 ? Number(S.plan.cap) : 7.5, out = {};
  for (const k of [0, 1, 2, 3, 4, 5, 6]) { const v = Number(c[k]); out[k] = c[k] !== undefined && c[k] !== "" && isFinite(v) && v >= 0 ? v : (k === 0 || k === 6 ? 0 : base); }
  return out;
}
const capOn = d => capsAll()[parseYmd(d).getDay()];
async function savePrefs(patch){
  S.prefs = {...(S.prefs || {}), ...patch};
  try { if (S.db) await S.db.doc("meta/prefs").set(S.prefs); } catch (e) { fail(e); }
}
/* durée réellement occupée : union des créneaux, sans compter deux fois le temps en parallèle */
function unionMin(iv){
  const a = iv.filter(x => x[1] > x[0]).map(x => [x[0], x[1]]).sort((x, y) => x[0] - y[0]);
  let tot = 0, cs = null, ce = null;
  for (const [st, en] of a) { if (cs === null || st > ce) { if (cs !== null) tot += ce - cs; cs = st; ce = en; } else if (en > ce) ce = en; }
  if (cs !== null) tot += ce - cs;
  return tot;
}
function busyOn(d, pf){ const its = dayBlocks(d, pf); return {net:unionMin(its.map(it => [it.s, it.e])), raw:its.reduce((s, it) => s + (it.e - it.s), 0)}; }
function dayRange(){ let h0 = Number(S.prefs && S.prefs.h0 != null ? S.prefs.h0 : S.plan.h0), h1 = Number(S.prefs && S.prefs.h1 != null ? S.prefs.h1 : S.plan.h1); if (!(h0 >= 0 && h0 < 24)) h0 = 8; if (!(h1 > h0 && h1 <= 24)) h1 = Math.max(h0 + 1, 19); return [h0, h1]; }
function planSpan(t){
  if (!t || !validYmd(t.debut)) return null;
  return [t.debut, validYmd(t.fin) && t.fin >= t.debut ? t.fin : t.debut];
}
function blocsOf(t){ return Array.isArray(t && t.blocs) ? t.blocs.filter(b => b && validYmd(b.d) && isFinite(b.s) && b.m > 0) : []; }
function schedMin(t){ const byD = {}; for (const b of blocsOf(t)) (byD[b.d] = byD[b.d] || []).push([b.s, b.s + b.m]); return Object.values(byD).reduce((s, iv) => s + unionMin(iv), 0); }
const firstBlockToday = t => blocsOf(t).filter(b => b.d === today()).sort((a, b) => a.s - b.s)[0];
function planState(t){
  if (!t || isDone(t) || t.archived) return "";
  if (blocsOf(t).some(b => b.d === today())) return "today";
  const sp = planSpan(t); if (!sp) return "";
  const d = today(); return sp[1] < d ? "late" : sp[0] <= d ? "today" : "";
}
function recToday(t){ return !isDone(t) && !t.archived && Array.isArray(t.jours) && t.jours.includes(new Date().getDay()); }
function recBlocks(t, d){
  if (!Array.isArray(t.jours) || !t.jours.length || isDone(t) || t.archived || !t.jours.includes(parseYmd(d).getDay())) return [];
  const s = isFinite(t.recH) ? t.recH : 540, m = Math.max(15, Math.round((Number(t.heures) || 1) * 60));
  return [{d, s, m, rec:true}];
}
function workDays(a, b){ let n = 0; for (let d = a; d <= b; d = addDays(d, 1)) if (!isWe(d)) n++; return n || diffDays(b, a) + 1; }
const projIdx = p => Math.max(0, allProjets().indexOf(p));
function stateIcons(t){
  const out = [];
  if (t.statut === "En cours") out.push('<span class="ic ic-enc" title="En cours">▶</span>');
  if (t.statut === "En attente") out.push('<span class="ic ic-att" title="En attente">⏸</span>');
  if (t.priorite === "Haute") out.push('<span class="ic ic-hp" title="Priorité haute">!</span>');
  if (quadrant(t) === "Faire") out.push('<span class="ic ic-q1" title="Quadrant Faire"></span>');
  return out.join("");
}
/* garde des dates de planning cohérentes avec les créneaux */
function normalizeSpan(t){
  const bl = blocsOf(t); if (!bl.length) return t;
  const ds = bl.map(b => b.d).sort(); const sp = planSpan(t);
  if (!sp) { t.debut = ds[0]; t.fin = ds[ds.length - 1]; }
  else { t.debut = ds[0] < sp[0] ? ds[0] : sp[0]; t.fin = ds[ds.length - 1] > sp[1] ? ds[ds.length - 1] : sp[1]; }
  return t;
}
async function writeBlocs(t, blocs, msg){
  const upd = normalizeSpan({...t, blocs});
  try { await S.db.doc("tasks/" + t.id).update({blocs, debut:upd.debut || "", fin:upd.fin || "", updated:nowIso()}); if (msg) toast(msg); } catch (e) { fail(e); }
}

/* ===== Agenda horaire ===== */
function dayBlocks(d, pf){
  const out = [];
  for (const t of live()) {
    if (pf && t.projet !== pf) continue;
    blocsOf(t).forEach((b, i) => { if (b.d === d) out.push({t, i, s:b.s, e:b.s + b.m}); });
    recBlocks(t, d).forEach(b => out.push({t, i:-1, s:b.s, e:b.s + b.m, rec:true}));
  }
  out.sort((a, b) => a.s - b.s || b.e - a.e);
  const res = []; let cl = [], end = -1;
  const flush = () => { const lanes = []; for (const it of cl) { let l = 0; while (lanes[l] !== undefined && lanes[l] > it.s) l++; lanes[l] = it.e; it.lane = l; } cl.forEach(it => it.lanes = lanes.length); res.push(...cl); cl = []; };
  for (const it of out) { if (cl.length && it.s >= end) { flush(); end = -1; } cl.push(it); end = Math.max(end, it.e); }
  if (cl.length) flush();
  return res;
}
function busyMin(d){ return busyOn(d, "").net; }
function freeSlot(days, dur){
  const [h0, h1] = dayRange(), td = today(), nm = Math.ceil(nowMin() / 15) * 15;
  for (const d of days) {
    if (d < td) continue;
    const busy = dayBlocks(d, "").map(it => [it.s, it.e]);
    if (h0 * 60 < 13 * 60 && h1 * 60 > 12 * 60) busy.push([12 * 60, 13 * 60]);  // pause déjeuner
    let s = Math.max(h0 * 60, d === td ? nm : 0);
    for (; s + dur <= h1 * 60; s += 15) if (!busy.some(([a, b]) => s < b && s + dur > a)) return {d, s};
  }
  return null;
}
function agDays(){
  const P = S.plan;
  if (isMobile()) return [validYmd(P.ref) ? P.ref : today()];
  const mon = mondayOf(P.ref), ds = [];
  for (let i = 0; i < 7; i++) { const d = addDays(mon, i); if (P.weekend || !isWe(d)) ds.push(d); }
  return ds;
}
function blockHtml(it, h0, h1){
  const t = it.t, ro = S.canWrite === false;
  const top = Math.max(0, (it.s - h0 * 60) / 60 * AG_H), bot = Math.min((h1 - h0) * AG_H, (it.e - h0 * 60) / 60 * AG_H);
  if (bot <= 0 || top >= (h1 - h0) * AG_H) return "";
  const hgt = Math.max(20, bot - top - 2), small = hgt < 40;
  return `<div class="blk${it.rec ? " rec" : ""}${isDone(t) ? " done" : ""}${small ? " small" : ""}" data-id="${esc(t.id)}" data-i="${it.i}" data-act="edit" ${!ro && !it.rec ? 'data-drag="blk"' : ""} role="button" tabindex="0"
    style="top:${top}px;height:${hgt}px;left:calc(${it.lane} / ${it.lanes} * 100% + 2px);width:calc(100% / ${it.lanes} - 4px);--pc:${projColor(t.projet)}">
    <div class="blk-t">${small ? "" : stateIcons(t)}${isDone(t) ? "✓ " : ""}${esc(t.tache)}</div>
    ${small ? "" : `<div class="blk-h">${hhmm(it.s)}–${hhmm(it.e)}${t.projet ? " · " + esc(t.projet) : ""}${it.rec ? " · récurrent" : ""}</div>`}
    ${!ro && !it.rec ? '<button class="blk-x" data-act="blk-del" aria-label="Retirer ce créneau">×</button><span class="blk-rz" data-drag="blkrz" aria-label="Changer la durée"></span>' : ""}
  </div>`;
}
function agendaView(){
  const P = S.plan, pf = P.proj, td = today(), [h0, h1] = dayRange(), days = agDays();
  const heads = days.map(d => {
    const dt = parseYmd(d), B = busyOn(d, pf), h = B.net / 60, par = (B.raw - B.net) / 60, cap = capOn(d);
    const pct = cap ? Math.min(100, Math.round(h / cap * 100)) : (h ? 100 : 0), lvl = h > cap ? "over" : h > cap * 0.8 ? "warn" : "ok";
    const dls = live().filter(t => !isDone(t) && t.echeance === d && (!pf || t.projet === pf));
    return `<div class="ag-dh${d === td ? " is-today" : ""}${isWe(d) ? " we" : ""}" data-dayhead="${d}">
      <div class="ag-dn"><span>${JOURS_COURTS[dt.getDay()]}</span><b>${dt.getDate()}</b>${d === td ? '<em>auj.</em>' : ""}</div>
      <div class="gauge ${lvl}" title="${hfmt(h)} h occupées sur ${hfmt(cap)} h disponibles${par ? ` (${hfmt(B.raw / 60)} h de tâches dont ${hfmt(par)} h en parallèle, comptées une seule fois)` : ""}"><i style="width:${pct}%"></i></div>
      <div class="ag-load">${h ? hfmt(h) + " h" : cap ? "libre" : "repos"}<span>/ ${hfmt(cap)} h</span>${par ? `<em class="ag-par" title="${hfmt(par)} h de tâches en parallèle, non comptées deux fois">∥ ${hfmt(par)} h</em>` : ""}</div>
      ${dls.length ? `<button class="ag-dl" data-id="${esc(dls[0].id)}" data-act="edit">◆ ${dls.length > 1 ? dls.length + " échéances" : esc(dls[0].tache)}</button>` : ""}
    </div>`;

  const allday = days.map(d => {
    const ts = live().filter(t => !isDone(t) && (!pf || t.projet === pf) && !(Array.isArray(t.jours) && t.jours.length) && planSpan(t) && planSpan(t)[0] <= d && planSpan(t)[1] >= d && !blocsOf(t).length);
    const shown = ts.slice(0, 3);
    return `<div class="ag-ad${isWe(d) ? " we" : ""}" data-agday="${d}">${shown.map(t => `<div class="ad-chip" data-id="${esc(t.id)}" data-act="edit" ${S.canWrite !== false ? 'data-drag="task"' : ""} style="--pc:${projColor(t.projet)}">${esc(t.tache)}</div>`).join("")}${ts.length > 3 ? `<span class="ad-more">+${ts.length - 3}</span>` : ""}</div>`;
  }).join("");

  </div>`;
}
function toPlace(pf, a, b){
  const inR = t => { const sp = planSpan(t); return sp && sp[1] >= a && sp[0] <= b ? 1 : 0; };

    .map(t => { const est = Math.round((Number(t.heures) || 0) * 60), sch = schedMin(t); return {t, est, sch, rem: est ? est - sch : (sch ? 0 : null)}; })
    .filter(x => x.rem === null || x.rem > 0)
    .sort((x, y) => inR(y.t) - inR(x.t) || score(y.t) - score(x.t) || byDue(x.t, y.t));
}

/* ===== Gantt ===== */
const GZ = {semaines:{W:32, label:"6 semaines"}, mois:{W:11, label:"4 mois"}, annee:{W:3.6, label:"Année"}};
function ganttRange(){
  const P = S.plan, z = GZ[P.zoom] ? P.zoom : "semaines", ref = validYmd(P.ref) ? P.ref : today(), rd = parseYmd(ref);
  if (z === "semaines") { const s = addDays(mondayOf(ref), -7); return {z, start:s, days:42}; }
  if (z === "mois") { const s = ymd(new Date(rd.getFullYear(), rd.getMonth() - 1, 1)); const e = ymd(new Date(rd.getFullYear(), rd.getMonth() + 3, 0)); return {z, start:s, days:diffDays(e, s) + 1}; }
  const s = `${rd.getFullYear()}-01-01`; return {z, start:s, days:diffDays(`${rd.getFullYear()}-12-31`, s) + 1};
}
function ganttView(){
  const P = S.plan, pf = P.proj, td = today(), {z, start, days} = ganttRange(), W = GZ[z].W, end = addDays(start, days - 1);
  const LW = isMobile() ? 150 : 320, TW = Math.round(days * W);
  const x = d => diffDays(d, start) * W;
  const off = ((parseYmd(start).getDay() + 6) % 7) * W;
  const bg = `background-image:repeating-linear-gradient(90deg,transparent 0 ${5 * W}px,var(--g-we) ${5 * W}px ${7 * W}px)${z === "semaines" ? `,repeating-linear-gradient(90deg,var(--g-line) 0 1px,transparent 1px ${W}px)` : `,repeating-linear-gradient(90deg,var(--g-line) 0 1px,transparent 1px ${7 * W}px)`};background-position:${-off}px 0,${z === "semaines" ? 0 : -off}px 0`;
  // en-têtes
  let months = "", seg = start;
  while (seg <= end) { const sd = parseYmd(seg), mEnd = ymd(new Date(sd.getFullYear(), sd.getMonth() + 1, 0)), e2 = mEnd < end ? mEnd : end, w = (diffDays(e2, seg) + 1) * W;
    months += `<div class="gh-m" style="left:${x(seg)}px;width:${w}px"><span>${w > 70 ? MOIS[sd.getMonth()] + " " + sd.getFullYear() : w > 26 ? MOIS_COURTS[sd.getMonth()] : ""}</span></div>`; seg = addDays(e2, 1); }
  let ticks = "";
  if (z === "semaines") for (let i = 0; i < days; i++) { const d = addDays(start, i), dt = parseYmd(d); ticks += `<div class="gh-d${isWe(d) ? " we" : ""}${d === td ? " td" : ""}" style="left:${i * W}px;width:${W}px"><span>${JOURS_COURTS[dt.getDay()].slice(0, 1)}</span>${dt.getDate()}</div>`; }
  else for (let d = mondayOf(start) < start ? addDays(mondayOf(start), 7) : start; d <= end; d = addDays(d, z === "annee" ? 14 : 7)) ticks += `<div class="gh-w" style="left:${x(d)}px">S${isoWeek(parseYmd(d))}</div>`;
  // lignes
  const showDone = !!P.showDone, collapsed = new Set(P.collapsed || []);
  const tasks = live().filter(t => (!pf || t.projet === pf) && (showDone || !isDone(t)) && t.statut !== "Récurrent" && !(Array.isArray(t.jours) && t.jours.length));
  const groups = new Map(); for (const p of allProjets()) groups.set(p, []); groups.set("", []);
  for (const t of tasks) { const k = groups.has(t.projet) ? t.projet : ""; groups.get(k).push(t); }
  const prog = t => isDone(t) ? 100 : Math.max(0, Math.min(100, Number(t.avancement) || 0));
  let rows = "", nRows = 0;
  for (const [p, ts] of groups) {
    if (!ts.length) continue;
    ts.sort((a, b) => (planSpan(a) ? 0 : 1) - (planSpan(b) ? 0 : 1) || (a.debut || "").localeCompare(b.debut || "") || byDue(a, b));
    const sch = ts.filter(t => planSpan(t)), col = projColor(p);
    const gs = sch.length ? sch.map(t => planSpan(t)[0]).sort()[0] : null, ge = sch.length ? sch.map(t => planSpan(t)[1]).sort().slice(-1)[0] : null;
    const gp = sch.length ? Math.round(sch.reduce((s, t) => s + prog(t) * (diffDays(planSpan(t)[1], planSpan(t)[0]) + 1), 0) / sch.reduce((s, t) => s + diffDays(planSpan(t)[1], planSpan(t)[0]) + 1, 0)) : 0;
    const open = !collapsed.has(p);
    rows += `<div class="gt-row grp" style="--pc:${col}"><div class="gt-name"><button class="g-tg" data-act="g-toggle" data-p="${esc(p)}" aria-expanded="${open}">${open ? "▾" : "▸"}</button><span class="g-dot"></span><b>${esc(p || "Sans projet")}</b><span class="g-n">${ts.length}</span>${sch.length ? `<span class="g-pc">${gp} %</span>` : ""}</div>
      <div class="gt-tl" style="${bg}">${gs && gs <= end && ge >= start ? `<div class="gsum" style="left:${x(gs < start ? start : gs)}px;width:${(diffDays(ge > end ? end : ge, gs < start ? start : gs) + 1) * W}px"><i style="width:${gp}%"></i></div>` : ""}</div></div>`;
    nRows++;
    if (!open) continue;
    for (const t of ts) {
      const sp = planSpan(t), late = !isDone(t) && sp && sp[1] < td, pr = prog(t);

async function decSave(month, mut){
  const cur = JSON.parse(JSON.stringify((S.decDocs && S.decDocs[month]) || {}));

  mut(cur); cur.updated = nowIso();

}

/* vue Année : un récapitulatif par mois */
function decYearHtml(days){
  const by = new Map();
  for (const Dy of days) { const m = monthOf(Dy.d), o = by.get(m) || {h:0, c:0, ab:0, n:0, nr:0, imp:0}; o.h += Dy.tot; o.c += Math.max(0, Dy.cap - Dy.absH) * 60; if (Dy.ab) o.ab += Dy.ab.part === "j" ? 1 : 0.5; o.n += Dy.rows.filter(r => r.m).length; o.nr += Dy.rows.filter(r => r.m && !r.ref).length; o.imp += Dy.rows.filter(r => r.imp).length; by.set(m, o); }
  const rows = [...by].filter(([, o]) => o.n > 0).sort((a, b) => a[0].localeCompare(b[0]));
  if (!rows.length) return '<div class="dec-none">Aucune heure sur cette année.</div>';
  const tH = rows.reduce((s, [, o]) => s + o.h, 0), tC = rows.reduce((s, [, o]) => s + o.c, 0);
  const ec = (h, c) => { const e = (h - c) / 60; return `<span class="${Math.abs(e) < 0.25 ? "dt-ok" : e > 0 ? "dt-over" : "dt-under"}">${e >= 0 ? "+" : "−"}${hfmt(Math.abs(e))} h</span>`; };
  return `<div class="tbl-wrap"><table class="tbl dec-year"><thead><tr><th>Mois</th><th>Heures</th><th>Dues</th><th>Écart</th><th>Absences</th><th>Lignes</th><th></th></tr></thead><tbody>
    ${rows.map(([m, o]) => { const dt = parseYmd(m + "-01"); return `<tr><td>${MOIS[dt.getMonth()].charAt(0).toUpperCase() + MOIS[dt.getMonth()].slice(1)}${o.imp ? ' <span class="dec-src man">importé</span>' : ""}</td><td>${hfmt(o.h / 60)} h</td><td>${hfmt(o.c / 60)} h</td><td>${ec(o.h, o.c)}</td><td>${o.ab ? hfmt(o.ab) + " j" : "–"}</td><td>${o.n}${o.nr ? ` <span class="dt-under">(${o.nr} sans réf.)</span>` : ""}</td><td><button class="btn ghost sm" data-act="dec-month" data-d="${m}-01">Voir</button></td></tr>`; }).join("")}
    <tr class="dec-ytot"><td>Total</td><td>${hfmt(tH / 60)} h</td><td>${hfmt(tC / 60)} h</td><td>${ec(tH, tC)}</td><td></td><td></td><td></td></tr></tbody></table>
    <p class="sub" style="margin:8px 2px">Seuls les mois qui contiennent des heures sont affichés et comptés dans le total.</p></div>`;
}

/* ----- Import d'un décompte existant (.xlsx / .csv) ----- */
const DEC_IMP_HEAD = {collaborateur:"collab", date:"d", duree:"m", reference:"ref", deplacement:"dep", lieu:"lieu", kilometres:"km", km:"km", description:"desc", facture:"fact"};
function impDur(v){
  if (v == null || v === "") return null;
  if (typeof v === "number") return v < 1 ? Math.round(v * 1440) : v <= 24 ? Math.round(v * 60) : null;
  if (v instanceof Date) return v.getHours() * 60 + v.getMinutes();
  const n = parseDur(v); return n === null || isNaN(n) ? null : n;
}
async function decImport(file){
  const say = m => { const el = $("#dec-progress"); if (el) el.textContent = m; S.decMsg = m; };
  try {
    say("Lecture du fichier…");
    const X = await loadXLSX(), wb = X.read(await file.arrayBuffer(), {type:"array"});
    let rows = null, hi = -1, refsFound = [];
    for (const n of wb.SheetNames) {
      const r = X.utils.sheet_to_json(wb.Sheets[n], {header:1, raw:true, defval:""});
      const k = r.findIndex(row => row.some(c => norm(c) === "date") && row.some(c => norm(c) === "duree"));
      if (k >= 0 && !rows) { rows = r; hi = k; }
      /* une feuille « REFERENCE » complète la liste des références */
      const kr = r.findIndex(row => row.length && norm(row[0]) === "reference" && !row.some(c => norm(c) === "date"));
      if (kr >= 0) refsFound.push(...r.slice(kr + 1).map(x => String(x[0] ?? "").trim()).filter(Boolean));
    }
    if (!rows) { say("Aucune colonne « Date » et « Durée » trouvée dans ce fichier."); return; }
    const head = rows[hi].map(c => DEC_IMP_HEAD[norm(c)] || null);
    let list = [];
    for (const row of rows.slice(hi + 1)) {
      const o = {}; head.forEach((h, j) => { if (h && o[h] === undefined) o[h] = row[j]; });
      const d = toYmd(o.d, X), m = impDur(o.m);
      if (!validYmd(d) || !m) continue;
      list.push({collab:String(o.collab ?? "").trim(), d, m, ref:String(o.ref ?? "").trim(), dep:norm(o.dep) === "oui", lieu:String(o.lieu ?? "").trim(), km:o.km === "" || o.km == null ? "" : String(o.km).replace(".", ","), desc:String(o.desc ?? "").replace(/\s+/g, " ").trim(), fact:String(o.fact ?? "").trim()});
    }
    if (!list.length) { say("Aucune ligne datée avec une durée sous l'en-tête."); return; }
    const names = [...new Set(list.map(x => x.collab).filter(Boolean))], me = norm(collabName());
    let skipped = 0;
    if (names.length > 1) {
      if (!names.some(n => norm(n) === me)) { say(`Ce fichier contient plusieurs collaborateurs (${names.slice(0, 5).join(", ")}…) et aucun ne s'appelle « ${collabName()} ». Corrige le nom dans Réglages ▸ Décompte des heures.`); return; }
      const before = list.length; list = list.filter(x => norm(x.collab) === me); skipped = before - list.length;
    }
    /* regroupement par mois, sans doublon si on réimporte le même fichier */
    const sig = x => [x.d, x.ref, x.m, norm(x.desc)].join("|");
    const byM = new Map(); for (const x of list) { const k = monthOf(x.d); if (!byM.has(k)) byM.set(k, []); byM.get(k).push(x); }
    let added = 0, dup = 0, i = 0;
    for (const [mo, arr] of byM) {
      i++; say(`Import : mois ${i} / ${byM.size}…`);
      await decSave(mo, c => {
        const have = new Set(c.manual.map(sig));
        for (const x of arr) { const s = sig(x); if (have.has(s)) { dup++; continue; } have.add(s); added++;
          c.manual.push({id:Date.now().toString(36) + Math.random().toString(36).slice(2, 7), d:x.d, ref:x.ref, m:x.m, desc:x.desc, dep:x.dep, lieu:x.lieu, km:x.km, fact:x.fact, imp:true}); }
      });
    }
    /* références inconnues ajoutées à la liste */
    const known = new Set(refList()), extra = [...new Set([...refsFound, ...list.map(x => x.ref)].filter(r => r && !known.has(r)))];
    if (extra.length) await savePrefs({refs:[...refList(), ...extra].sort((a, b) => a.localeCompare(b, "fr"))});
    const ms = [...byM.keys()].sort();
    say(`${added} ligne${added > 1 ? "s" : ""} importée${added > 1 ? "s" : ""} (${ms.length} mois, de ${ms[0].split("-").reverse().join("/")} à ${ms[ms.length - 1].split("-").reverse().join("/")})${dup ? ` · ${dup} déjà présente${dup > 1 ? "s" : ""}` : ""}${skipped ? ` · ${skipped} d'autres collaborateurs ignorées` : ""}${extra.length ? ` · ${extra.length} nouvelle${extra.length > 1 ? "s" : ""} référence${extra.length > 1 ? "s" : ""}` : ""}.`);
    toast("Import du décompte terminé");
    S.dec.mode = "annee"; S.dec.ref = ms[ms.length - 1] + "-01"; saveDecUi(); render(true);
  } catch (e) { say(e && e.message === "xlsx" ? "Le lecteur Excel n'a pas pu se charger. Vérifie ta connexion." : "Import interrompu : " + (e && (e.code || e.message) || "erreur")); }
}

const ymAdd = (ym, n) => { const [y, m] = ym.split("-").map(Number); const d = new Date(y, m - 1 + n, 1); return d.getFullYear() + "-" + z2(d.getMonth() + 1); };
const ymCount = (a, b) => { if (!ymOk(a) || !ymOk(b)) return 0; const [y1, m1] = a.split("-").map(Number), [y2, m2] = b.split("-").map(Number); return Math.max(0, (y2 - y1) * 12 + m2 - m1 + 1); };

  if (act === "archive") {
    const old = live().filter(t => isDone(t) && validYmd(t.cloture) && diffDays(today(), t.cloture) > 30).map(t => t.id);
    try { await runPool(old, tid => S.db.doc("tasks/" + tid).update({archived:true, updated: nowIso()})); toast(`${old.length} tâche(s) archivée(s)`); } catch (e) { fail(e); }
    render(true); return;
  }
});
$("#fab").addEventListener("click", () => openEditor(null, {projet: S.view === "jour" ? S.jourProjet : S.view === "matrice" ? S.matProjet : S.view === "planning" ? S.plan.proj : (S.f.projets.length === 1 ? S.f.projets[0] : "")}));
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape") document.querySelectorAll(".ao-ov,.ao-pick,.copybox").forEach(x => x.remove());
  if (ev.key === "Enter" && ev.target.dataset && (ev.target.dataset.ao || ev.target.dataset.bib) && /INPUT|TEXTAREA/.test(ev.target.tagName)) { ev.preventDefault(); ev.target.blur(); return; }
  if (ev.key === "Enter" && ev.target.id === "na-nom") { ev.preventDefault(); document.querySelector('[data-act="ao-create"]')?.click(); return; }
  if (ev.key === "Enter" && ev.target.dataset && ev.target.dataset.dec && /INPUT|TEXTAREA/.test(ev.target.tagName)) { ev.preventDefault(); ev.target.blur(); return; }
  if (ev.key === "Escape" && S.edit) closeEditor();
  if (S.edit && ev.key === "Enter" && (ev.metaKey || ev.ctrlKey)) saveEditor();
  if (!S.edit && ev.key === "n" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || "") && S.status === "ready" && S.canWrite !== false) { ev.preventDefault(); openEditor(null); }
  if (!S.edit && ev.key === "/" && S.view === "taches" && document.activeElement?.id !== "t-search") { ev.preventDefault(); $("#t-search")?.focus(); }
});
let searchT = 0;
document.addEventListener("input", ev => {
  if (ev.target.id === "e-av") { const l = $("#e-av-v"); if (l) l.textContent = ev.target.value + " %"; }
  if (ev.target.id === "t-search") { clearTimeout(searchT); searchT = setTimeout(() => { S.f.q = ev.target.value; updateTaches(); }, 120); }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.dataset && t.dataset.dec) { decChange(t); return; }
  if (t.dataset && t.dataset.ao) { aoChange(t); return; }
  if (t.dataset && t.dataset.bib) { bibChange(t); return; }
  if (t.id === "dec-imp-file" && t.files && t.files[0]) { decImport(t.files[0]); t.value = ""; return; }
  if (t.id === "dec-upto") { S.dec.upto = t.checked; saveDecUi(); render(true); return; }
  if (decSettingsChange(t)) return;
  if (t.id === "t-sort") { S.f.sort = t.value; saveUi(); updateTaches(); }
  if (t.id === "t-hide") { S.f.hideDone = t.checked; saveUi(); updateTaches(); }
  if (t.id === "t-arch") { S.f.showArch = t.checked; saveUi(); updateTaches(); }
  if (t.id === "p-we") { S.plan.weekend = t.checked; saveUi(); render(true); }
  if (t.id === "p-done") { S.plan.showDone = t.checked; saveUi(); render(true); }
  if (t.classList && t.classList.contains("set-capd")) {
    const n = parseFloat(String(t.value).replace(",", ".")), k = t.dataset.d;
    if (isFinite(n) && n >= 0 && n <= 24) { const caps = {...capsAll(), [k]:Math.round(n * 100) / 100}; savePrefs({caps}); toast(`${JOURS[k].charAt(0).toUpperCase() + JOURS[k].slice(1)} : ${hfmt(n)} h disponibles`); render(true); }
    else t.value = hfmt(capsAll()[k]);
  }
  if (t.id === "set-h0" || t.id === "set-h1") { const n = parseInt(t.value, 10); const k = t.id === "set-h0" ? "h0" : "h1"; if (n >= 0 && n <= 24) { S.plan[k] = n; savePrefs({[k]:n}); saveUi(); toast(`Journée : ${dayRange()[0]} h – ${dayRange()[1]} h`); } else t.value = dayRange()[k === "h0" ? 0 : 1]; }
  if (t.id === "set-cap") { const n = parseFloat(String(t.value).replace(",", ".")); if (isFinite(n) && n > 0 && n <= 24) { S.plan.cap = n; saveUi(); toast(`Capacité : ${hfmt(n)} h par jour`); } else t.value = hfmt(capDay()); }
  if (t.id === "imp-file" && t.files && t.files[0]) { importFile(t.files[0]); t.value = ""; }
  if (t.id === "e-ech" && S.edit) S.edit.echeance = t.value;
});
document.addEventListener("submit", async ev => {
  ev.preventDefault();
  const form = ev.target;
  if (form.id === "quick") {
    const inp = $("#qa-text"), txt = inp.value.trim(); if (!txt) return;
    const projet = $("#qa-proj")?.value || "";
    inp.value = "";
    try { await saveTask({id:null, projet, tache:txt, statut:"À faire", priorite:"", urgent:null, important:null, echeance:"", responsable:S.lists.responsables[0] || "", theme:"", type:"", cloture:"", commentaires:""}); toast("Ajoutée à " + (projet || "la liste")); } catch (e) { fail(e); }
    inp.focus(); return;
  }
  const lk = form.dataset.listForm;
  if (lk) { const inp = form.querySelector("input"); const v = inp.value.trim(); if (!v || S.lists[lk].includes(v)) { inp.value = ""; return; }
    inp.value = ""; inp.blur(); await saveLists({...S.lists, [lk]: [...S.lists[lk], v]}); render(true); }
});

/* Glisser-déposer (Matrice) */
let dragId = null, dragMoved = false;
document.addEventListener("dragstart", ev => { const c = ev.target.closest?.(".card"); if (!c) return; dragId = c.dataset.id; dragMoved = true; c.classList.add("dragging"); try { ev.dataTransfer.setData("text/plain", dragId); ev.dataTransfer.effectAllowed = "move"; } catch (e) {} });
document.addEventListener("dragend", ev => { ev.target.closest?.(".card")?.classList.remove("dragging"); document.querySelectorAll(".quad.over").forEach(q => q.classList.remove("over")); dragId = null; setTimeout(() => { dragMoved = false; }, 50); });
document.addEventListener("dragover", ev => { const q = ev.target.closest?.(".quad[data-quad]"); if (!q || !dragId || q.dataset.quad === "—") return; ev.preventDefault(); document.querySelectorAll(".quad.over").forEach(x => x !== q && x.classList.remove("over")); q.classList.add("over"); });
document.addEventListener("drop", ev => { const q = ev.target.closest?.(".quad[data-quad]"); if (!q || !dragId) return; ev.preventDefault(); q.classList.remove("over"); if (q.dataset.quad !== "—") setQuad(dragId, q.dataset.quad); });

/* ---------- Démarrage ---------- */
async function init(){
  route();
  const use = window.claude && window.claude.use ? window.claude.use.bind(window.claude) : null;
  const db = use ? await use("db") : null;
  if (!db) { S.status = "nodb"; render(true); return; }
  S.db = db;
  const timer = setTimeout(() => { if (!S.confirmed) { S.slow = true; render(); } }, 10000);
  db.collection("tasks").onSnapshot(snap => {
    S.tasks = new Map(snap.docs.map(d => [d.id, {id:d.id, ...d.data()}]));
    if (S.status === "loading") { S.status = "ready"; S.built = null; }
    if (!snap.metadata.fromCache) { S.confirmed = true; S.slow = false; clearTimeout(timer); }
    schedule();
  }, err => { clearTimeout(timer); S.status = "error"; S.error = err && err.code; render(true); });
  db.doc("meta/prefs").onSnapshot(s => { S.prefs = (s.exists && s.data()) || {}; schedule(); }, () => {});
  db.collection("ao").onSnapshot(snap => { S.aos = new Map(snap.docs.map(d => [d.id, {...d.data(), id:d.id}])); if (S.view === "chiffrage") schedule(); }, () => {});
  db.doc("meta/biblio").onSnapshot(s => { S.biblio = (s.exists && s.data()) || null; if (S.view === "chiffrage") schedule(); }, () => {});
  db.collection("decompte").onSnapshot(snap => { S.decDocs = Object.fromEntries(snap.docs.map(d => [d.id, d.data()])); if (S.view === "heures") schedule(); }, () => {});
  db.doc("meta/lists").onSnapshot(s => {
    const d = (s.exists && s.data()) || {};
    S.lists = {projets: Array.isArray(d.projets) ? d.projets : [], responsables: Array.isArray(d.responsables) ? d.responsables : [], types: Array.isArray(d.types) ? d.types : []};
    S.listsLoaded = true;
    if (S.view === "taches") S.built = null;
    schedule();
  }, () => {});
  const user = use ? await use("user") : null;
  if (user) { try { const w = await user.can("data.write"); if (w === false) { S.canWrite = false; render(true); } } catch (e) {} }
}
setInterval(() => { if (S.status === "ready" && !S.edit) render(); }, 60000);
init();
})();
</script>

if ("serviceWorker" in navigator) { window.addEventListener("load", () => { navigator.serviceWorker.register("./sw.js").catch(() => {}); }); }
</script>
