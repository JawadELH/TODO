async function decSave(month, mut){
  const cur = JSON.parse(JSON.stringify((S.decDocs && S.decDocs[month]) || {}));
  cur.rows = cur.rows || {}; cur.manual = cur.manual || []; cur.abs = cur.abs || {};
  mut(cur); cur.updated = nowIso();
  S.decDocs = {...S.decDocs, [month]:cur}; schedule();
  try { await S.db.doc("decompte/" + month).set(cur); } catch (e) { fail(e); }
}
async function decChange(el){
  const row = el.closest(".dec-row"), day = el.closest(".dec-day"), f = el.dataset.dec;
  const d = (row || day).dataset.d, month = monthOf(d);
  if (f === "abs" || f === "part") {
    const v = el.value;
    await decSave(month, c => { if (f === "abs") { if (v) c.abs[d] = {type:v, part:(c.abs[d] && c.abs[d].part) || "j"}; else delete c.abs[d]; } else if (c.abs[d]) c.abs[d].part = v; });
    render(true); return;
  }
  const key = row.dataset.key, mid = row.dataset.mid;
  let v = el.value;
  if (f === "m") { const n = parseDur(v); if (n === null || isNaN(n)) { toast("Durée non reconnue : écris 2, 2,5, 2:30 ou 2h30"); render(true); return; } v = n; }
  if (f === "dep") v = v === "1";
  if (f === "ref" && !mid) {
    /* ligne issue du planning : la référence s'applique aux tâches */
    const rs = decRows(d).find(r => r.key === key); if (!rs) return;
    const ids = rs.tasks.map(t => t.id);
    try { await runPool(ids, id => S.db.doc("tasks/" + id).update({reference:v, updated:nowIso()})); toast(v ? `Référence appliquée à ${ids.length} tâche${ids.length > 1 ? "s" : ""}` : "Référence retirée"); } catch (e) { fail(e); }
    for (const id of ids) { const t = S.tasks.get(id); if (t) t.reference = v; }
    render(true); return;
  }
  /* durée d'une ligne issue de l'agenda : les créneaux sont ajustés */
  if (f === "m" && !mid && await syncDur(d, key, v)) { render(true); return; }
  await decSave(month, c => {
    if (mid) { const r = c.manual.find(x => x.id === mid); if (r) r[f] = v; }
    else {
      const o = c.rows[key] = c.rows[key] || {}, base = decRows(d).find(r => r.key === key);
      if (base && ((f === "m" && v === base.auto) || (f === "desc" && v === base.autoDesc))) delete o[f]; else o[f] = v;
      if (!Object.keys(o).length) delete c.rows[key];
    }
  });
  if (el.tagName === "SELECT") render(true);
}
async function decAction(act, a){

      if (kr >= 0) refsFound.push(...r.slice(kr + 1).map(x => String(x[0] ?? "").trim()).filter(Boolean));
    }

    let list = [];
    for (const row of rows.slice(hi + 1)) {
      const o = {}; head.forEach((h, j) => { if (h && o[h] === undefined) o[h] = row[j]; });

    let skipped = 0;
    if (names.length > 1) {
      if (!names.some(n => norm(n) === me)) { say(`Ce fichier contient plusieurs collaborateurs (${names.slice(0, 5).join(", ")}…) et aucun ne s'appelle « ${collabName()} ». Corrige le nom dans Réglages ▸ Décompte des heures.`); return; }

    toast("Import du décompte terminé");
    S.dec.mode = "annee"; S.dec.ref = ms[ms.length - 1] + "-01"; saveDecUi(); render(true);
  } catch (e) { say(e && e.message === "xlsx" ? "Le lecteur Excel n'a pas pu se charger. Vérifie ta connexion." : "Import interrompu : " + (e && (e.code || e.message) || "erreur")); }

        <div><span class="kc-l">Gagnés</span><b class="ok">${won12.length}</b><small>${keur(sum(won12))}</small></div>
        <div><span class="kc-l">Taux de réussite</span><b>${sg(rateN)}</b><small>${rateE === null ? "sur les AO décidés" : sg(rateE) + " en montant"}</small></div>
        <div><span class="kc-l">Ratio honoraires / travaux</span><b>${ratio ? pct(ratio) : "—"}</b><small>moyenne des AO gagnés</small></div></div>
      ${next.length ? `<div class="bd-next"><span class="lbl">Prochaines remises</span>${next.map(a => { const n = diffDays(a.remise, td); return `<button class="bd-ao" data-act="bd-ao" data-id="${a.id}"><span class="bd-j ${n <= 3 ? "late" : n <= 7 ? "today" : ""}">${n ? "J−" + n : "Aujourd'hui"}</span><b>${esc(a.nom || "Sans titre")}</b><small>${fmt(a.remise, true)} · ${eur(calc.get(a.id).tot)} · étape ${Math.min(7, (a.step || 0) + 1)}/7</small></button>`; }).join("")}</div>` : '<p class="sub">Aucune remise à venir.</p>'}</section>
    <section class="panel bd-b"><div class="bd-h"><h2>Projets gagnés</h2><span class="sub">Jours vendus comparés au temps passé (décompte des heures, ${hj} h par jour)</span></div>
      ${rows.length ? `<div class="tbl-wrap"><table class="tbl bd-p"><thead><tr><th>Projet</th><th>Vendu</th><th>Passé</th><th>Reste</th><th>Consommation</th><th>Fin prévue</th></tr></thead><tbody>
        ${rows.map(({a, R, s}) => `<tr><td><button class="lnk" data-act="bd-ao" data-id="${a.id}">${esc((a.won && a.won.projet) || a.nom || "Sans titre")}</button><small class="mut">${esc(eur(R.tot))}${a.reference ? "" : " · pas de référence"}</small></td>
          <td>${jfmt(R.jours)} j</td><td>${s ? jfmt(s.passe) + " j" : "—"}</td><td class="${s && s.reste < 0 ? "warn" : ""}">${s ? jfmt(s.reste) + " j" : "—"}</td>
          <td>${s ? `<div class="bd-bar ${s.pct > 1 ? "over" : s.pct >= 0.8 ? "hi" : ""}"><i style="width:${Math.min(100, s.pct * 100)}%"></i><span>${Math.round(s.pct * 100)} %</span></div>` : `<button class="btn ghost sm" data-act="bd-ao" data-id="${a.id}">Relier au décompte</button>`}</td><td>${R.b ? ymLab(R.b) : "—"}</td></tr>`).join("")}</tbody></table></div>`
        : '<p class="sub">Aucun AO gagné pour l\'instant. Quand tu passes un chiffrage en « Gagné », l\'app crée le projet et son suivi apparaît ici.</p>'}</section>
    <section class="panel bd-b"><div class="bd-h"><h2>Organisation et temps</h2></div>
      <div class="bd-k">${kT.map(([c, n, l]) => `<div><span class="kc-l">${l}</span><b class="${c === "late" && n ? "late" : c === "done" ? "ok" : ""}">${n}</b></div>`).join("")}
        <div><span class="kc-l">Heures du mois</span><b>${hfmt(hM / 60)} h</b><small>sur ${hfmt(cM / 60)} h dues à ce jour</small></div></div>
      <details class="bd-more"><summary>Détail des tâches par projet</summary>${old}</details></section>`;
}
async function bordAction(act, a){
  if (act === "bd-ao") { const x = S.aos.get(a.dataset.id); if (x && x.statut === "Gagné") { migrateAo(x); x.step = 6; } S.chif.mode = "ao"; S.chif.id = a.dataset.id; saveChifUi(); if (location.hash !== "#chiffrage") location.hash = "#chiffrage"; else render(true); return; }
}

const HELP = [
  {k:"demarrer", t:"Démarrer", html:`

    <h4>Synchronisation</h4><p>Tes données sont enregistrées dans ton compte et se synchronisent entre ton Mac et ton iPhone. L'app fonctionne aussi sans réseau : les modifications partent dès que la connexion revient.</p>
    <h4>Raccourcis clavier</h4><ul><li>${kbd("N")} : nouvelle tâche.</li><li>${kbd("/")} : chercher dans les tâches.</li><li>${kbd("Cmd")} + ${kbd("Entrée")} : enregistrer la tâche ouverte.</li><li>${kbd("Échap")} : fermer une fenêtre.</li><li>${kbd("Entrée")} dans un champ du chiffrage ou du décompte : valider la saisie.</li></ul>`},
  {k:"jour", t:"Ma journée", html:`
    <p>La page d'accueil regroupe, triées par urgence, priorité puis échéance, les tâches <b>en retard</b>, <b>planifiées aujourd'hui</b>, <b>dues bientôt</b>, en <b>quadrant « Faire »</b> (urgent et important) et <b>en cours</b>.</p>
    <ul><li>Le champ d'ajout rapide crée une tâche dans le projet choisi.</li><li>Les créneaux du jour et leur total d'heures apparaissent en haut, sans compter deux fois les tâches qui se chevauchent.</li><li>Le cercle à gauche d'une tâche la marque comme terminée.</li></ul>${go("jour", "Ouvrir Ma journée")}`},
  {k:"taches", t:"Tâches", html:`
    <p>Crée une tâche avec le bouton ${kbd("+")} ou la touche ${kbd("N")}. Dans la fiche :</p>
    <ul><li><b>Projet, statut, priorité, échéance, responsable, thème, type, commentaires.</b></li>

    <h4>Terminer et archiver</h4><p>Une tâche terminée reste visible (case « Masquer les terminées »). Les tâches terminées depuis plus de 30 jours s'archivent depuis les Réglages : elles quittent les vues mais restent dans les exports.</p>${go("taches", "Ouvrir les tâches")}`},
  {k:"matrice", t:"Matrice", html:`<p>La matrice d'Eisenhower classe les tâches ouvertes : <b>Faire</b> (urgent et important), <b>Planifier</b> (important), <b>Déléguer</b> (urgent), <b>Plus tard</b>. Glisse une carte d'un quadrant à l'autre pour changer son urgence et son importance.</p>${go("matrice", "Ouvrir la matrice")}`},
  {k:"planning", t:"Planning", html:`
    <h4>Agenda</h4><ul>

  {k:"heures", t:"Heures (décompte)", html:`
    <p>Le décompte présente ton temps comme ton tableau : Collaborateur, Date, Durée, Référence, Déplacement, Lieu, Kilomètres, Description, Facture. <b>Heures, agenda et tâches sont synchronisés dans les deux sens.</b></p>
    <table class="hp-t"><thead><tr><th>Tu fais…</th><th>Résultat</th></tr></thead><tbody>
      <tr><td>Un créneau dans l'agenda ou dans une tâche</td><td>La ligne du décompte se calcule toute seule.</td></tr>
      <tr><td>Tu changes la <b>durée</b> d'une ligne dans Heures</td><td>L'agenda suit : un créneau est ajouté au premier moment libre du jour, ou le dernier créneau est raccourci.</td></tr>
      <tr><td><b>+ Ajouter du temps</b> dans Heures</td><td>Tu choisis la tâche (ou tu en crées une) : un créneau est placé dans l'agenda. « Ligne libre » garde une ligne sans agenda (déplacement…).</td></tr>

    <ul><li><b>Une ligne par jour et par référence</b>, la description reprend le nom des tâches du jour.</li>
      <li><b>Tâches en parallèle</b> : le temps commun n'est jamais compté deux fois ; par défaut il va à la <b>référence qui couvre le plus</b> (Réglages ▸ Décompte des heures). Le temps non compté (<b>temps masqué</b>) reste visible : la ligne garde 0 h avec la mention « temps masqué ».</li>

    <h4>Importer un décompte</h4><ol class="hp-steps"><li><b>Importer un décompte…</b> ▸ ton fichier Excel (colonnes Date et Durée au minimum). Seules tes lignes sont gardées.</li>
      <li>Une <b>fenêtre d'aperçu</b> s'ouvre, rien n'est encore enregistré : jours <b>ajoutés</b>, <b>remplacés</b> (import précédent différent), <b>identiques</b> (déjà à jour) et <b>en conflit</b> avec l'agenda. Touche un jour pour comparer le fichier et l'existant.</li>

      <li><b>Valider l'import</b>. Réimporter le même fichier ne crée aucun doublon ; un fichier modifié remplace les jours concernés.</li></ol>
    <p>Un jour importé sans passer par l'agenda affiche « le temps de l'agenda n'est pas compté » s'il a aussi des créneaux, avec un bouton <b>Revenir à l'agenda</b>.</p>
    <h4>Récupérer les lignes</h4><ul><li><b>Copier pour Excel</b> : colonnes A à I, prêtes à coller sous ton tableau. Chaque jour a aussi son bouton « Copier ».</li><li><b>Exporter en .xlsx</b> : le décompte mis en forme et un récapitulatif.</li></ul>${go("heures", "Ouvrir le décompte")}`},

  {k:"chiffrage", t:"Chiffrage AO", html:`
    <p>Sur ordinateur, survole un chiffrage (liste des chiffrages ou tableau de bord) pour voir sa fiche : remise, montant, ratios, missions, planning, pièces du marché lues, suivi s'il est gagné.</p>
    <p>La liste des chiffrages affiche leur statut (en cours, envoyé, gagné, perdu, abandonné), leur montant et la prochaine remise. Un chiffrage se fait en <b>7 étapes</b> ; la barre du bas montre le total en permanence et passe à l'étape suivante.</p>
    <ol class="hp-steps">
      <li><b>Pièces</b> : le registre des pièces du marché et ton analyse (voir la rubrique suivante). Facultatif.</li>
      <li><b>Projet</b> : nom, client, maître d'ouvrage, type d'opération, montant des travaux, surface et <b>missions demandées</b>. Les missions servent à te proposer les prestations.</li>
      <li><b>Planning</b> : une structure de départ (conception, réalisation…), puis la durée de chaque phase en mois. Une phase <b>transverse</b> couvre toute la durée (plateforme, pilotage).</li>
      <li><b>Hypothèses</b> : les quantités du projet (maquettes, lots, zones, cycles, niveaux…) et le coût d'un déplacement.</li>
      <li><b>Prestations</b> : « ✦ Proposer » remplit les phases selon tes missions. Chaque ligne se chiffre de deux façons :
        <ul><li><b>UO (unité d'œuvre)</b> : une quantité × un temps unitaire et/ou un prix unitaire. La quantité peut suivre une hypothèse : « selon les maquettes à suivre ».</li>
          <li><b>Temps</b> : une fréquence par mois × la durée de la phase × un temps par occurrence. Exemple : 1 audit par mois pendant 12 mois × 1,5 j.</li></ul>
        Le badge UO / Temps change le mode ; le bouton ⋯ montre le calcul complet, le prix unitaire, la période et l'option.</li>
      <li><b>Prix</b> : TJM par profil, marge, remise commerciale, arrondi, TVA. Saisis un <b>prix cible</b> pour connaître la remise nécessaire. Les <b>contrôles</b> signalent les lignes à 0 €, les hypothèses vides, les pics de charge et l'écart avec ton ratio habituel.</li>
      <li><b>Synthèse</b> : décomposition par phase et par mission, facturation mensuelle, options, <b>offre PDF</b>, <b>export Excel</b> et statut.</li></ol>
    <h4>Offre envoyée : verrouillage et versions</h4><p>Dès qu'un chiffrage passe en <b>Envoyé</b> (ou Gagné, Perdu, Abandonné), l'app enregistre la <b>V1</b> et <b>verrouille</b> l'offre : prix, prestations et réglages ne sont plus modifiables, et le statut ne peut plus revenir à « En cours ». Pour une négociation ou une modification interne :</p>
    <ol class="hp-steps"><li><b>Nouvelle version</b> : choisis le motif (négociation, modification interne, validation interne, correction…) et ajoute un commentaire.</li>
      <li>Modifie l'offre : le bandeau montre l'écart avec la version précédente.</li>
      <li><b>Valider la V2</b> l'enregistre et reverrouille l'offre, ou <b>Annuler les modifications</b> revient à la version précédente.</li></ol>
    <p><b>Historique</b> : chaque version avec sa date, son auteur, son motif, son montant, les changements par rapport à la précédente et son <b>offre PDF</b> (le numéro d'offre porte l'indice V1, V2…). Le statut, la référence du décompte et l'analyse des pièces du marché restent modifiables.</p>
    <h4>Les options</h4><p>Une prestation passe en option avec ⋯ ▸ « En option » ou avec « Option libre » à l'étape Synthèse. Les options sont numérotées, hors total, et présentées à part dans l'offre. « Intégrer » les fait entrer dans le total.</p>
    <h4>L'offre PDF</h4><p>À l'étape Synthèse : choisis l'entreprise émettrice, le numéro, la date, la validité et le niveau de détail (montant seul, par phase ou détail des prestations). Tu peux afficher ou non les jours, les taux, les options, les hypothèses et le bloc « bon pour accord ».</p>
    <h4>L'export Excel</h4><p>Quatre onglets : Offre, Détail, Hypothèses, Facturation. Tout est en formules : les <span class="hp-y">cellules jaunes</span> sont modifiables et le reste se recalcule.</p>${go("chiffrage", "Ouvrir les chiffrages")}`},
  {k:"pieces", t:"Pièces du marché", html:`
    <ol class="hp-steps"><li>À l'étape <b>Pièces</b>, touche <b>Ajouter un dossier</b> et choisis le dossier du DCE (sur iPhone : <b>Ajouter des fichiers</b>).</li>
      <li>L'app reconnaît le type de chaque fichier d'après son nom (RC, AE, CCAP, CCTP, DPGF, planning, cahier des charges BIM…) et pré-coche les pièces écrites. Corrige les cases et les types, puis ajoute.</li>
      <li>Au fil de ta lecture, donne un <b>état</b> à chaque pièce : non lu, en cours, lu partiellement, lu, sans objet.</li>

      <li>Rédige la <b>synthèse générale</b> en bas de page : tous tes points y sont regroupés par type, avec la pièce d'origine.</li></ol>
    <p>La <b>fiche d'analyse PDF</b> et le <b>registre Excel</b> gardent une trace de ton travail. Les fichiers ne quittent pas ton ordinateur : l'app enregistre seulement leur nom, leur emplacement, l'état de lecture et tes notes. Aucune analyse n'est faite automatiquement.</p>`},
  {k:"base", t:"Base des unités d'œuvre et entreprises", html:`
    <h4>Base des unités d'œuvre</h4><p>Depuis Chiffrage AO ▸ <b>Base des unités d'œuvre</b> :</p>
    <ul><li>Chaque prestation a un mode (UO ou temps), une unité, un temps unitaire, un prix unitaire, un profil, un déplacement éventuel et une quantité par défaut.</li>
      <li><b>Proposée</b> : quand l'app la propose (jamais, 1re phase, chaque phase, phases suivantes, dernière phase) et pour quelles étapes : C conception, R réalisation, E exploitation, T transverse.</li>

  {k:"gagne", t:"AO gagné et suivi", html:`
    <p>Quand tu passes un chiffrage en <b>Gagné</b>, une fenêtre propose de créer :</p>
    <ul><li>le <b>projet</b> dans tes listes ;</li><li>sa <b>référence</b> pour le décompte des heures ;</li><li><b>une tâche par phase</b>, avec ses dates, ses heures estimées (jours vendus × heures par jour) et le détail des prestations en commentaire.</li></ul>
    <p>Ensuite, à l'étape Synthèse et dans le Bord : <b>jours vendus</b>, <b>jours passés</b> et <b>reste</b>. Le total vient du décompte des heures sur la référence du projet ; le détail par phase vient des créneaux posés sur les tâches du projet.</p>`},
  {k:"bord", t:"Tableau de bord", html:`
    <p>C'est la page d'accueil de l'app (modifiable dans Réglages ▸ Affichage). De haut en bas :</p>
    <ul><li><b>En bref</b> : heures prévues aujourd'hui, heures de la semaine (réalisées, encore prévues, capacité), tâches en retard, échéances à 7 jours, prochaine remise d'AO.</li>
      <li><b>Aujourd'hui</b> et <b>À traiter</b> : tes créneaux du jour et les tâches en retard ou à rendre ; un clic ouvre la tâche.</li>
      <li><b>Plan de charge</b> : 3 mois passés et 8 à venir, en jours ou en heures. Chaque couleur est un projet : <b>plein</b> = temps réalisé (décompte des heures), <b>clair</b> = temps prévu dans l'agenda et AO gagnés, <b>très clair</b> = tâches estimées pas encore placées (réparties sur leurs dates), <b>hachuré</b> = AO en cours et envoyés s'ils étaient gagnés. Le trait est ta <b>capacité</b> : heures par jour de la semaine (Réglages ▸ Planning) moins les jours fériés et tes absences. Elle varie donc d'un mois à l'autre selon le nombre de jours travaillés. Le pourcentage sous chaque mois est la charge rapportée à la capacité.</li>
      <li>Les AO sont <b>lissés</b> : les jours de chaque phase sont répartis également sur ses mois. Un AO gagné dont les tâches ont été créées est compté par ses tâches, jamais deux fois. Survole un mois pour le détail par projet.</li>
      <li><b>Appels d'offres</b>, <b>Projets gagnés</b> (vendu, passé, reste), <b>Charge de l'équipe</b> (chefs et administrateurs) et <b>Organisation et temps</b>.</li></ul>${go("bord", "Ouvrir le tableau de bord")}`},

  {k:"reglages", t:"Réglages", html:`
    <p>Les réglages sont rangés par thème, avec un sommaire : Affichage, Compte et équipe, Listes, Planning, Décompte des heures, Import / export.</p>
    <ul><li><b>Affichage</b> (propre à chaque appareil) : thème sombre, clair ou automatique, page d'ouverture de l'app, onglets affichés (masque ceux que tu n'utilises pas).</li>

      <li><b>Planning</b> : tes heures disponibles pour chaque jour de la semaine (0 pour un jour non travaillé) et la plage horaire de l'agenda.</li>
      <li><b>Décompte des heures</b> : nom du collaborateur, arrondi des durées, référence par défaut de chaque projet et liste des références.</li>
      <li><b>Importer / Exporter</b> : tes tâches depuis ou vers Excel.</li>

      <li><b>Archives</b> : range les tâches terminées depuis plus de 30 jours.</li></ul>${go("reglages", "Ouvrir les réglages")}`},
  {k:"equipe", t:"Équipe et partage", html:`
    <p>Dans l'app installée, tu peux travailler à plusieurs dans une <b>entreprise</b>. La case <b>Espace</b> du cartouche indique où tu es. En haut à droite, le rond avec tes initiales ouvre ton <b>Profil</b> (compte, espaces, invitations, équipe) et le bouclier ouvre le <b>Panneau admin</b> (administrateurs seulement).</p>
    <h4>Espaces</h4><ul><li><b>Mon espace perso</b> : tes données, visibles par toi seul.</li><li><b>Une entreprise</b> : ses tâches, chiffrages, projets, base des unités d'œuvre et entreprises émettrices sont communs à ses membres. Tu peux appartenir à plusieurs entreprises et passer de l'une à l'autre.</li></ul>
    <h4>Mettre en place</h4><ol class="hp-steps"><li>Profil ▸ <b>Créer une entreprise</b> : tu en deviens l'administrateur, et le Panneau admin s'ouvre.</li>
      <li>Panneau admin ▸ <b>Services</b> (facultatif) : BIM, Synthèse, Études…</li>
      <li><b>Inviter un collaborateur</b> : son e-mail, son rôle, ses services. « Copier le message » prépare l'e-mail à lui envoyer.</li>
      <li>Ton collègue crée son compte avec cette adresse, <b>vérifie son e-mail</b> (lien reçu par mail), puis touche <b>Rejoindre</b> dans son Profil.</li>
      <li>Profil ▸ « Reprendre mes données perso » copie tes tâches et chiffrages existants dans l'entreprise.</li></ol>
    <h4>Quitter ou supprimer</h4><ul><li><b>Quitter</b> (Profil) : tu n'as plus accès aux éléments partagés. Le dernier administrateur ne peut pas partir sans nommer un autre administrateur.</li>
      <li><b>Supprimer l'entreprise</b> (Panneau admin, en bas) : efface définitivement toutes ses données (tâches, chiffrages, listes, base, entreprises émettrices, heures, invitations) et retire tous les collaborateurs. Il faut taper le nom de l'entreprise pour confirmer. Les espaces perso ne sont pas touchés. Fais une sauvegarde avant.</li></ul>
    <h4>Rôles</h4><table class="hp-t"><tbody><tr><td><b>Administrateur</b></td><td>Gère l'entreprise, les services, les collaborateurs, la base des unités d'œuvre et les entreprises émettrices. Voit la charge et le décompte de tous.</td></tr>
      <tr><td><b>Chef de service</b></td><td>Modifie la base des unités d'œuvre et les entreprises émettrices. Voit la charge et le décompte des membres de ses services.</td></tr>
      <tr><td><b>Membre</b></td><td>Utilise l'app ; la base et les entreprises émettrices sont en lecture seule.</td></tr></tbody></table>
    <h4>Visibilité de chaque élément</h4><ul><li><b>🔒 Personnel</b> : toi seul (et la personne à qui tu assignes la tâche).</li><li><b>Service</b> : les membres du service choisi.</li><li><b>Entreprise</b> : tous les membres.</li></ul>
    <p>Le choix se fait dans la fiche d'une tâche et à l'étape Projet d'un chiffrage. Par défaut, une tâche prend la visibilité de son projet (Réglages ▸ Projets : 🔒 projet perso, ou commun) et un chiffrage est partagé avec l'entreprise. Seul le créateur ou un administrateur change la visibilité. Une tâche perso assignée à un collègue devient visible par l'entreprise.</p>
    <h4>Au quotidien</h4><ul><li><b>Responsable</b> : choisis un collègue ; la tâche apparaît dans sa journée et son planning.</li>
      <li><b>Afficher</b> (Tâches, Planning, Matrice, Bord) : mes tâches, un service ou toute l'entreprise. Ma journée et les heures restent toujours les tiennes.</li>
      <li><b>Créneaux</b> : chacun place son propre temps sur une tâche partagée ; ton agenda et ton décompte ne comptent que tes créneaux.</li>
      <li><b>Chefs et administrateurs</b> : le Bord montre la charge de l'équipe, et Heures ▸ <b>Collaborateur</b> affiche le décompte d'un collègue (lecture seule, mis à jour à chaque ouverture de l'app par ce collègue).</li></ul>`},
  {k:"exports", t:"Exports et fichiers", html:`
    <table class="hp-t"><thead><tr><th>Fichier</th><th>Où</th><th>Contenu</th></tr></thead><tbody>
      <tr><td>Tâches (.xlsx, .csv)</td><td>Réglages</td><td>Toutes les tâches, archives comprises.</td></tr>

  {k:"faq", t:"Questions fréquentes", html:`
    <details><summary>Où sont mes données ?</summary><p>Dans ton compte (espace perso) ou dans l'entreprise, synchronisés entre tes appareils. Les fichiers du DCE, eux, restent sur ton ordinateur : seuls leurs noms et tes notes sont enregistrés.</p></details>
    <details><summary>Le total du décompte ne correspond pas à l'agenda.</summary><p>Le temps en parallèle n'est compté qu'une fois (attribué à la référence qui couvre le plus, ou partagé selon ton réglage), et chaque ligne est arrondie selon le réglage « Arrondi des durées ». Un écart d'une ou deux minutes peut venir de l'arrondi. Vérifie aussi les lignes modifiées à la main (bouton ↺).</p></details>
    <details><summary>Un collègue ne voit pas ma tâche.</summary><p>Vérifie sa visibilité dans la fiche : 🔒 Personnel n'est visible que par toi. Passe-la en Service ou Entreprise, ou assigne-la-lui. Côté collègue, choisis « Toute l'entreprise » dans Afficher.</p></details>

    <details><summary>Comment mettre à jour l'app sur iPhone et Mac ?</summary><p>Redépose sur GitHub tous les fichiers du dossier todo-bim reçu, <b>sauf config.js</b>, puis ferme et rouvre l'app. Tes données ne bougent pas.</p></details>
    <details><summary>Je ne peux pas choisir un dossier sur iPhone.</summary><p>Safari ne le permet pas : utilise « Ajouter des fichiers » et sélectionne plusieurs fichiers dans l'app Fichiers.</p></details>

    <details><summary>Pourquoi mon chiffrage a changé d'étape ?</summary><p>L'étape Pièces a été ajoutée au début : les chiffrages existants ont été décalés d'un cran, sans autre changement.</p></details>`},

/* ---------- Actions ---------- */
async function teamAction(act, a){
  const T = TMX(); if (!T) return;
  const run = async (p, ok) => { try { await p; if (ok) toast(ok); } catch (e) { console.warn(e); toast(e && e.code === "permission-denied" ? "Action refusée : droits insuffisants." : "Échec. Vérifie ta connexion et réessaie."); } };
  if (act === "tm-notice-ok") { T.notice = ""; render(true); return; }
  if (act === "tm-switch") { T.switchTo(a.dataset.id); return; }
  if (act === "tm-scope") { S.scope = a.dataset.v; try { localStorage.setItem("todobim.scope", S.scope); } catch (e) {} S.built = null; render(true); return; }
  if (act === "tm-verif-send") { await run(T.sendVerification()); const m = $("#tm-verif-msg"); if (m) m.textContent = `E-mail envoyé à ${T.email}. Ouvre-le, clique sur le lien, puis reviens ici et touche « J'ai cliqué sur le lien ». Pense à regarder les spams.`; return; }
  if (act === "tm-verif-check") { let ok = false; try { ok = await T.checkVerified(); } catch (e) {} const m = $("#tm-verif-msg"); if (ok) { toast("Adresse vérifiée"); render(true); } else if (m) m.textContent = "Adresse pas encore vérifiée. Clique sur le lien reçu par e-mail, puis réessaie."; return; }
  if (act === "tm-inv-ok") { const inv = T.invites.find(x => x.id === a.dataset.id); if (!inv) return; a.disabled = true;
    try { const id = await T.acceptInvite(inv); toast("Bienvenue dans " + inv.orgName); setTimeout(() => T.switchTo(id), 600); } catch (e) { a.disabled = false; toast(e && e.code === "unverified" ? "Vérifie d'abord ton adresse e-mail." : "Impossible de rejoindre : l'invitation a peut-être été annulée."); } return; }
  if (act === "tm-pwd") { const m = $("#tm-pwd-msg"); try { await T.resetPassword(); if (m) m.textContent = `E-mail envoyé à ${T.email} : clique sur le lien pour choisir un nouveau mot de passe (regarde aussi les spams).`; } catch (e) { if (m) m.textContent = "Envoi impossible pour l'instant. Réessaie."; } return; }
  if (act === "logout-tm") { if (window.TODO_ACCOUNT) window.TODO_ACCOUNT.signOut(); return; }
  if (act === "tm-inv-no") { const inv = T.invites.find(x => x.id === a.dataset.id); if (inv) await run(T.declineInvite(inv), "Invitation refusée"); render(true); return; }
  if (!T.active) return;
  const adm = T.isAdmin();
  if (act === "tm-vis") {
    if (a.dataset.kind === "task" && S.edit) { readEditorInputs(); S.edit._vis = a.dataset.v; S.edit._visAuto = false; if (S.edit._vis === "svc" && !S.edit._svc) S.edit._svc = (T.me.services || [])[0] || (T.services()[0] || {}).id || ""; renderEditor(); return; }
    if (a.dataset.kind === "ao") { const ao = curAo(); if (!ao || !canVis(ao)) return; ao._vis = a.dataset.v; if (ao._vis === "svc" && !ao._svc) ao._svc = (T.me.services || [])[0] || (T.services()[0] || {}).id || ""; if (ao._vis !== "svc") ao._svc = ""; await aoSave(ao); render(true); toast(ao._vis === "perso" ? "Chiffrage personnel" : ao._vis === "svc" ? "Partagé avec " + svcName(ao._svc) : "Partagé avec l'entreprise"); return; }
    return;
  }
  if (act === "tm-proj-share") { await shareProject(a.dataset.p, a.dataset.to === "perso"); return; }
  if (act === "tm-sv-del" && adm) {
    if (!a.classList.contains("armed")) { a.classList.add("armed"); toast("Touche encore pour supprimer ce service"); return; }
    const id = a.dataset.id, svs = {...(T.org.services || {})}; delete svs[id];
    await run(T.saveOrg({services:svs}));
    for (const [k, m] of T.members) if ((m.services || []).includes(id)) await run(T.setMember(k, {services:m.services.filter(x => x !== id)}));
    toast("Service supprimé"); return;
  }
  if (act === "tm-m-svc" && adm) { const m = T.members.get(a.dataset.uid); if (!m) return; const s = a.dataset.id, cur = m.services || []; await run(T.setMember(a.dataset.uid, {services:cur.includes(s) ? cur.filter(x => x !== s) : [...cur, s]})); return; }
  if (act === "tm-m-del" && adm) { if (!a.classList.contains("armed")) { a.classList.add("armed"); a.textContent = "Confirmer"; return; } await run(T.removeMember(a.dataset.uid), "Collaborateur retiré"); return; }
  if (act === "tm-inv-cancel" && adm) { await run(T.cancelInvite(a.dataset.email), "Invitation annulée"); return; }
  if (act === "tm-inv-copy") { const txt = `Bonjour,\n\nJe t'invite à rejoindre « ${T.org.nom} » sur TO DO BIM.\n1. Ouvre ${a.dataset.url}\n2. Crée ton compte avec l'adresse ${a.dataset.email}\n3. Touche ton profil (le rond avec tes initiales, en haut à droite), vérifie ton adresse e-mail et accepte l'invitation.\n\nÀ bientôt !`; if (await copyText(txt)) toast("Message copié : colle-le dans un e-mail"); else showCopyBox(txt); return; }
  if (act === "tm-leave") { if (!a.classList.contains("armed")) { a.classList.add("armed"); a.textContent = "Confirmer : quitter l'entreprise"; return; } await run(T.leave()); return; }
  if (act === "tm-copy") { await copyPerso(); return; }
  if (act === "tm-org-del" && adm) {
    const v = (($("#tm-del-name") || {}).value || "").trim();
    if (v !== T.org.nom.trim()) { toast("Tape exactement le nom de l'entreprise pour confirmer."); $("#tm-del-name")?.focus(); return; }
    if (!a.classList.contains("armed")) { a.classList.add("armed"); a.textContent = "Dernière confirmation : supprimer tout"; return; }
    a.disabled = true; S.tmBusy = "del";
    const say = m => { S.tmDel = m; const el = $("#tm-del-msg"); if (el) el.textContent = m; };
    try { await T.deleteOrg(say); } catch (e) { console.warn(e); S.tmBusy = ""; a.disabled = false; say("Suppression interrompue : vérifie ta connexion et relance. Ce qui a déjà été supprimé l'est définitivement ; l'entreprise reste bloquée en suppression."); }
    return;
  }
  if (act === "tm-pub-nav" || act === "tm-pub-copy") { await pubAction(act, a); return; }
  if (act === "tm-who") { S.decWho = a.dataset.uid === T.uid ? "" : a.dataset.uid; render(true); return; }
}

/* ---------- Copie de l'espace perso vers l'entreprise ---------- */
async function copyPerso(){
  const T = TM(); if (!T || S.tmBusy) return;
  const vT = ($("#tm-copy-vis") || {}).value || "perso", vA = ($("#tm-copy-ao") || {}).value || "org";
  const say = m => { S.tmBusy = m; const el = $("#tm-copy-msg"); if (el) el.textContent = m; };
  say("Lecture de ton espace perso…");
  try {
    const P = await T.readPerso();
    let nt = 0, na = 0;
    const projs = new Set();
    for (const t of P.tasks || []) {
      if (S.tasks.has(t.id)) continue;
      const {id, ...body} = t;
      if (t.projet) projs.add(t.projet);
      const blocs = (Array.isArray(body.blocs) ? body.blocs : []).map(b => ({...b, u:T.uid}));
      await S.db.doc("tasks/" + id).set({...body, blocs, _vis:vT, _svc:"", _resp:T.uid, responsable:T.nameOf(T.uid)});
      if (++nt % 10 === 0) say(`${nt} tâches copiées…`);
    }
    for (const a of P.ao || []) { if (S.aos.has(a.id)) continue; const {id, ...body} = a; await S.db.doc("ao/" + id).set({...body, _vis:vA, _svc:"", _resp:""}); na++; }
    const L = S.lists, next = {projets:[...L.projets], responsables:[...L.responsables], types:[...L.types]};
    const pl = (P.lists && P.lists.projets) || [];
    for (const p of [...pl, ...projs]) if (p && !next.projets.includes(p)) { next.projets.push(p); if (vT === "perso") T.pendingPerso[p] = true; }
    for (const ty of (P.lists && P.lists.types) || []) if (ty && !next.types.includes(ty)) next.types.push(ty);
    await saveLists(next);
    let extra = "";
    if (T.canBase()) {
      if (P.uo && !S.uo) { await S.db.doc("meta/uo").set(P.uo); extra += ", base des unités d'œuvre"; }
      if (P.societes && !(S.socs && (S.socs.list || []).length)) { await S.db.doc("meta/societes").set(P.societes); extra += ", entreprises émettrices"; }
    }
    S.tmBusy = ""; S.tmMsg = `Copie terminée : ${nt} tâche${nt > 1 ? "s" : ""}, ${na} chiffrage${na > 1 ? "s" : ""}${extra}.`; const el = $("#tm-copy-msg"); if (el) el.textContent = S.tmMsg;
    toast("Données copiées dans l'entreprise");
  } catch (e) { console.warn(e); S.tmBusy = ""; say("Copie interrompue : vérifie ta connexion et relance (les éléments déjà copiés ne seront pas dupliqués)."); }
}

/* ---------- Décompte : publication pour le chef de service, vue d'un collaborateur ---------- */
let pubHash = {}, pubT = 0;
function pubMonth(m){
  const [y, mo] = m.split("-").map(Number), last = ymd(new Date(y, mo, 0)), lim = last < today() ? last : today();
  const lines = [], abs = {}; let tot = 0, cap = 0;
  for (let d = m + "-01"; d <= lim; d = addDays(d, 1)) {
    for (const r of decRows(d)) if (r.m > 0 || r.masq > 0) { lines.push({d, m:r.m, masq:r.masq || 0, ref:r.ref || "", desc:r.desc || "", lieu:r.lieu || "", km:r.km || "", dep:!!r.dep, fact:r.fact || ""}); tot += r.m; }
    const ab = absOn(d); if (ab && !ab.auto) abs[d] = ab.type + (ab.part !== "j" ? " (½)" : "");
    cap += Math.max(0, capOn(d) - absHours(d)) * 60;
  }
  return {lines, abs, tot, cap, nom:collabName()};
}
function teamPublish(){
  const T = TM(); if (!T || S.status !== "ready" || S.canWrite === false) return;
  const m0 = today().slice(0, 7), mp = ymd(new Date(parseYmd(m0 + "-01").getFullYear(), parseYmd(m0 + "-01").getMonth() - 1, 1)).slice(0, 7);
  for (const m of [mp, m0]) {
    const d = pubMonth(m), h = JSON.stringify(d);
    if (pubHash[m] === h) continue;
    pubHash[m] = h; T.publish(m, {...d, updated:nowIso()}).catch(() => { delete pubHash[m]; });
  }
}

  const keep = {}; for (const k of VER_KEEP) if (k in ao) keep[k] = ao[k];

function pushVersion(ao, n, motif, comment){

/* différences entre deux versions */
function aoDiffHtml(a0, a1){
  const R0 = calcAo(a0), R1 = calcAo(a1), m0 = new Map(R0.lines.map(x => [x.l.id, x])), m1 = new Map(R1.lines.map(x => [x.l.id, x]));

  for (const [id, y] of m0) if (!m1.has(id)) del.push(y);
  const P0 = a0.params || {}, P1 = a1.params || {}, par = [];

  const sgn = n => (n >= 0 ? "+" : "−") + eur(Math.abs(n));
  return `<div class="vd"><p class="vd-t">Total : <b class="${dT > 0 ? "up" : dT < 0 ? "down" : ""}">${sgn(dT)}</b> · jours : ${dJ >= 0 ? "+" : "−"}${jfmt(Math.abs(dJ))} j</p>
    ${par.length ? `<h5>Réglages</h5><ul class="vd-p">${par.map(x => `<li>${x}</li>`).join("")}</ul>` : ""}

    ${add.length ? `<h5>Prestations ajoutées (${add.length})</h5><ul>${add.map(x => li(x, "+" + eur(x.c.prix))).join("")}</ul>` : ""}
    ${del.length ? `<h5>Prestations retirées (${del.length})</h5><ul>${del.map(x => li(x, "−" + eur(x.c.prix))).join("")}</ul>` : ""}
    ${!par.length && !mod.length && !add.length && !del.length ? `<p class="sub" style="margin:0">Aucun changement de prestation ni de réglage de prix.</p>` : ""}</div>`;

async function verAction(act, a, ao){
  const ov = a.closest(".overlay");

    ov && ov.remove(); await aoSave(ao); render(true); toast(`Version V${n} ouverte : tu peux modifier l'offre`); return;
  }
  if (act === "ao-ver-ok") {

  }
  if (act === "ao-ver-cancel") {

    S.verArm = 0;
    const base = aoVersions(ao).find(v => v.n === ao.rev.base) || aoLastVer(ao);
    if (base) applySnap(ao, base.snap); delete ao.rev;
    await aoSave(ao); render(true); toast("Modifications annulées : retour à la V" + (base ? base.n : 1)); return;
  }
  if (act === "ao-ver-pdf") { const v = aoVersions(ao).find(x => x.n === Number(a.dataset.n)); if (v) aoPdf(snapAo(ao, v)); return; }
  if (act === "ao-ver-restore") {
    const v = aoVersions(ao).find(x => x.n === Number(a.dataset.n)); if (!v || !ao.rev) return;
    if (!a.classList.contains("armed")) { a.classList.add("armed"); a.textContent = `Confirmer : reprendre la V${v.n}`; return; }
    applySnap(ao, v.snap); ov && ov.remove(); await aoSave(ao); render(true); toast(`Contenu de la V${v.n} repris dans la V${ao.rev.n}`); return;
  }
}

/* ---------- Tableau de bord : en bref, aujourd'hui, plan de charge lissé ---------- */
S.pcUnit = (() => { try { return localStorage.getItem("todobim.pcUnit") || "j"; } catch (e) { return "j"; } })();
const daysIn = m => { const [y, mo] = m.split("-").map(Number); return new Date(y, mo, 0).getDate(); };
/* capacité d'un mois : heures par jour de la semaine (Réglages ▸ Planning) − jours fériés − absences */
function capDetail(m){
  let base = 0, fer = 0, abs = 0, jo = 0;
  for (let k = 1; k <= daysIn(m); k++) {
    const d = `${m}-${z2(k)}`, c = capOn(d); if (c <= 0) continue;
    jo++; base += c; const a = absOn(d); if (!a) continue;
    const h = a.part === "j" ? c : c / 2; if (a.auto) fer += h; else abs += h;
  }
  return {jo, base, fer, abs, cap:Math.max(0, base - fer - abs)};
}
const addTo = (mp, k, v) => { if (v > 0) mp.set(k, (mp.get(k) || 0) + v); };
function pcData(){
  const td = today(), m0 = ymOf(td), hj = hjOf(), tom = addDays(td, 1);

const nowIso = () => new Date().toISOString();
function clean(t){ const {id, ...body} = t; for (const k of Object.keys(body)) if (body[k] === undefined) delete body[k]; return body; }
async function saveTask(t){
  if (!S.db) return;
  teamBeforeSave(t);
  const isNew = !t.id;
  const ref = isNew ? S.db.collection("tasks").doc() : S.db.doc("tasks/" + t.id);
  const body = clean({...t, updated: nowIso(), created: t.created || nowIso()});
  await ref.set(body);
  if (t.projet) { S.lastProjet = t.projet; saveUi(); }
  await ensureInLists(t);

}
async function ensureInLists(t){
  const L = S.lists, next = {projets:[...L.projets], responsables:[...L.responsables], types:[...L.types]};
  let ch = false;
  if (t.projet && !next.projets.includes(t.projet)) { next.projets.push(t.projet); ch = true; if (TM() && t._vis === "perso") TM().pendingPerso[t.projet] = true; }
  if (t.responsable && !next.responsables.includes(t.responsable)) { next.responsables.push(t.responsable); ch = true; }
  if (t.type && !next.types.includes(t.type)) { next.types.push(t.type); ch = true; }
  if (ch) await saveLists(next);
}

function saveLists(next){ S.lists = next; listsWriting = listsWriting.then(() => S.db.doc("meta/lists").set(next)).catch(fail); return listsWriting; }

/* ---------- Import / export ---------- */
let xlsxP = null;
function loadXLSX(){
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (!xlsxP) xlsxP = new Promise((res, rej) => { const s = document.createElement("script"); s.src = "./xlsx.core.min.js"; s.onload = () => res(window.XLSX); s.onerror = () => { xlsxP = null; rej(new Error("xlsx")); }; document.head.appendChild(s); });
  return xlsxP;
}
const HEAD = {projet:"projet", tache:"tache", statut:"statut", priorite:"priorite", urgent:"urgent", important:"important", echeance:"echeance", responsable:"responsable", theme:"theme", type:"type", "cloture le":"cloture", "cloturee le":"cloture", cloture:"cloture", commentaires:"commentaires", commentaire:"commentaires", "planifiee du":"debut", debut:"debut", au:"fin", fin:"fin", "temps estime (h)":"heures", "temps estime":"heures"};
function toYmd(v, X){
  if (v == null || v === "") return "";
  if (typeof v === "number" && X) { const d = X.SSF.parse_date_code(v); return d ? `${d.y}-${z2(d.m)}-${z2(d.d)}` : ""; }
  if (v instanceof Date) return ymd(v);
  const s = String(v).trim(); let m;
  if ((m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/))) { const y = m[3].length === 2 ? "20" + m[3] : m[3]; return `${y}-${z2(m[2])}-${z2(m[1])}`; }
  if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return `${m[1]}-${m[2]}-${m[3]}`;
  return "";
}
const yesNo = v => { const s = norm(v); return s === "oui" || s === "yes" || s === "1" || s === "true" ? true : s === "non" || s === "no" || s === "0" || s === "false" ? false : null; };
async function runPool(items, fn, n = 4, onStep){
  let i = 0, done = 0;
  const workers = Array.from({length: Math.min(n, items.length)}, async () => { while (i < items.length) { const it = items[i++]; await fn(it); done++; onStep && onStep(done); } });
  await Promise.all(workers);
}
async function importJson(file, say){
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { say("Ce fichier JSON est illisible."); return; }
  const raw = Array.isArray(data) ? data : Array.isArray(data.tasks) ? data.tasks : null;
  if (!raw) { say("Aucune tâche trouvée dans ce fichier."); return; }
  const tasks = raw.map(t => t && t.data && !t.tache ? {id:t.id, ...t.data} : t).filter(t => t && String(t.tache || "").trim());
  const replace = (document.querySelector('input[name="imode"]:checked') || {}).value === "replace";
  if (replace) { for (const id of [...S.tasks.keys()]) await S.db.doc("tasks/" + id).delete(); }
  let n = 0;
  for (const t of tasks) {
    const {id, ...body} = t;
    const ref = id && !replace && S.tasks.has(id) ? S.db.collection("tasks").doc() : (id ? S.db.doc("tasks/" + id) : S.db.collection("tasks").doc());
    await ref.set({...body, statut: STATUTS.includes(body.statut) ? body.statut : "À faire", created: body.created || nowIso(), updated: body.updated || nowIso()});
    n++;
  }
  const L = S.lists, inc = data.lists || {}, next = {projets:[...L.projets], responsables:[...L.responsables], types:[...L.types]};
  for (const k of ["projets", "responsables", "types"]) for (const v of (inc[k] || [])) if (v && !next[k].includes(v)) next[k].push(v);
  for (const t of tasks) { if (t.projet && !next.projets.includes(t.projet)) next.projets.push(t.projet); if (t.responsable && !next.responsables.includes(t.responsable)) next.responsables.push(t.responsable); if (t.type && !next.types.includes(t.type)) next.types.push(t.type); }
  await saveLists(next);
  if (data.prefs && typeof data.prefs === "object") await S.db.doc("meta/prefs").set(replace ? data.prefs : {...data.prefs, ...(S.prefs || {})});
  if (data.decompte && typeof data.decompte === "object") for (const [m, v] of Object.entries(data.decompte)) if (/^\d{4}-\d{2}$/.test(m) && v && (replace || !(S.decDocs || {})[m])) await S.db.doc("decompte/" + m).set(v);
  if (Array.isArray(data.ao)) for (const a of data.ao) if (a && a.id && (replace || !S.aos.has(a.id))) await S.db.doc("ao/" + a.id).set(a);
  if (data.uo && (replace || !S.uo)) await S.db.doc("meta/uo").set(data.uo);
  say(`${n} tâche${n > 1 ? "s" : ""} importée${n > 1 ? "s" : ""}.`); toast("Import terminé");
}
async function importFile(file){
  const say = m => { S.impMsg = m; const el = $("#imp-progress"); if (el) el.textContent = m; };
  try {
    say("Lecture du fichier…");
    if (/\.json$/i.test(file.name) || file.type === "application/json") { await importJson(file, say); return; }
    const X = await loadXLSX();
    const wb = X.read(await file.arrayBuffer(), {type:"array"});
    let rows = null;
    const names = [...wb.SheetNames].sort((a, b) => (norm(b) === "to do") - (norm(a) === "to do"));
    let hi = -1;
    for (const n of names) { const r = X.utils.sheet_to_json(wb.Sheets[n], {header:1, raw:true, defval:""}); const k = r.findIndex(row => row.some(c => norm(c) === "tache")); if (k >= 0) { rows = r; hi = k; break; } }
    if (!rows) { say("Aucune colonne « Tâche » trouvée dans ce fichier."); return; }
    const head = rows[hi].map(c => HEAD[norm(c)] || null);
    const tasks = [];
    for (const r of rows.slice(hi + 1)) {
      const o = {}; head.forEach((h, j) => { if (h) o[h] = r[j]; });
      const tache = String(o.tache ?? "").trim(); if (!tache) continue;
      const statut = STATUTS.find(s => norm(s) === norm(o.statut)) || "À faire";
      tasks.push({projet:String(o.projet ?? "").trim(), tache, statut, priorite: PRIOS.find(p => norm(p) === norm(o.priorite)) || "",
        urgent: yesNo(o.urgent), important: yesNo(o.important), echeance: toYmd(o.echeance, X), responsable: String(o.responsable ?? "").trim(),
        theme: String(o.theme ?? "").trim(), type: String(o.type ?? "").trim(), cloture: statut === "Terminé" ? (toYmd(o.cloture, X) || today()) : "",
        commentaires: String(o.commentaires ?? "").trim(), debut: toYmd(o.debut, X), fin: toYmd(o.fin, X) || toYmd(o.debut, X),
        heures: isFinite(parseFloat(String(o.heures ?? "").replace(",", "."))) ? parseFloat(String(o.heures).replace(",", ".")) : "", jours: [], created: nowIso(), updated: nowIso()});
    }
    if (!tasks.length) { say("Aucune tâche trouvée sous l'en-tête."); return; }
    const replace = (document.querySelector('input[name="imode"]:checked') || {}).value === "replace";
    if (replace) { const old = [...S.tasks.keys()]; say(`Suppression des ${old.length} tâches existantes…`); await runPool(old, id => S.db.doc("tasks/" + id).delete()); }
    await runPool(tasks, t => S.db.collection("tasks").doc().set(t), 4, d => say(`Import : ${d} / ${tasks.length}`));
    const L = S.lists, next = {projets:[...L.projets], responsables:[...L.responsables], types:[...L.types]};
    for (const t of tasks) { if (t.projet && !next.projets.includes(t.projet)) next.projets.push(t.projet); if (t.responsable && !next.responsables.includes(t.responsable)) next.responsables.push(t.responsable); if (t.type && !next.types.includes(t.type)) next.types.push(t.type); }
    await saveLists(next);
    say(`${tasks.length} tâche${tasks.length > 1 ? "s" : ""} importée${tasks.length > 1 ? "s" : ""}.`); toast("Import terminé");
  } catch (e) { say(e && e.message === "xlsx" ? "Le lecteur Excel n'a pas pu se charger. Vérifie ta connexion." : "Import interrompu : " + (e && (e.code || e.message) || "erreur")); }
}

  const po = allProjets();
  return [...S.tasks.values()].sort((a, b) => po.indexOf(a.projet) - po.indexOf(b.projet) || byDue(a, b)).map((t, i) => [i + 1, t.projet || "", t.tache || "", t.statut || "", t.priorite || "",
    t.urgent === true ? "Oui" : t.urgent === false ? "Non" : "", t.important === true ? "Oui" : t.important === false ? "Non" : "",
    t.echeance || "", quadrant(t), t.responsable || "", t.theme || "", t.type || "", t.cloture || "", t.commentaires || "", t.archived ? "Oui" : "", t.debut || "", t.fin || "", t.heures || "",
    Array.isArray(t.jours) ? t.jours.map(n => JOURS_COURTS[n]).join(" ") : ""]);
}
const EXP_HEAD = ["N°","Projet","Tâche","Statut","Priorité","Urgent","Important","Échéance","Quadrant","Responsable","Thème","Type","Clôturé le","Commentaires","Archivée","Planifiée du","au","Temps estimé (h)","Répétition"];
async function doBackup(){
  const prog = $("#bak-progress"); const say = m => { if (prog) prog.textContent = m; };
  const dl = await window.claude.use("downloads");
  const payload = {app:"TO DO BIM", format:2, saved: nowIso(), lists:S.lists, prefs:S.prefs || {}, decompte:S.decDocs || {}, ao:[...(S.aos || new Map()).values()], uo:S.uo || null, tasks:[...S.tasks.values()]};
  try { await dl.save({filename:`TODO_BIM_sauvegarde_${today()}.json`, data:JSON.stringify(payload, null, 1)});
    S.backupAt = today(); try { localStorage.setItem("todobim.backupAt", S.backupAt); } catch (e) {}
    say("Sauvegarde prête. Range-la dans Fichiers ▸ iCloud Drive."); render(true);
  } catch (e) { say(e && e.code === "declined" ? "Sauvegarde annulée." : "Sauvegarde impossible pour l'instant."); }
}
async function doExport(kind){
  const prog = $("#exp-progress"); const say = m => { if (prog) prog.textContent = m; };
  const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
  if (!dl) { say("L'export n'est pas disponible sur cet appareil."); return; }
  const stamp = today();
  try {
    if (kind === "csv") {
      const q = v => { const s = String(v ?? ""); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
      const lines = [EXP_HEAD, ...exportRows().map(r => r.map((v, j) => (j === 7 || j === 12 || j === 15 || j === 16) && v ? fmt(v, true) : v))].map(r => r.map(q).join(";"));
      await dl.save({filename:`TODO_BIM_${stamp}.csv`, data:"﻿" + lines.join("\r\n")});
    } else {
      say("Préparation du fichier…");
      await tasksXlsx(stamp);
    }
    say("Fichier prêt.");
  } catch (e) { say(e && e.code === "declined" ? "Téléchargement annulé." : e && e.message === "xlsx" ? "Le module Excel n'a pas pu se charger." : "Export impossible pour l'instant."); }
}

/* ---------- Événements ---------- */
document.addEventListener("click", async ev => {
  const segEl = ev.target.closest("[data-seg]");
  if (segEl) {
    const kind = segEl.dataset.seg, val = segEl.dataset.val;
    if (kind === "jour") { S.jourProjet = val; saveUi(); render(true); return; }
    if (kind === "mat") { S.matProjet = val; saveUi(); render(true); return; }
    if (kind === "plan") { S.plan.proj = val; saveUi(); render(true); return; }
    const arr = S.f[kind]; const i = arr.indexOf(val);
    if (ev.metaKey || ev.ctrlKey || ev.shiftKey) { i >= 0 ? arr.splice(i, 1) : arr.push(val); }
    else { S.f[kind] = (i >= 0 && arr.length === 1) ? [] : [val]; }
    saveUi(); updateTaches(); return;
  }
  const pdBtn = ev.target.closest("[data-pd]");
  if (pdBtn && S.edit) {
    const v = pdBtn.dataset.pd; const deb = $("#e-deb"), fin = $("#e-fin");
    const d = v === "" ? "" : v === "mon" ? addDays(mondayOf(today()), 7) : addDays(today(), Number(v));
    const len = validYmd(deb.value) && validYmd(fin.value) ? Math.max(0, diffDays(fin.value, deb.value)) : 0;
    deb.value = d; fin.value = d ? addDays(d, len) : ""; return;
  }
  const pfBtn = ev.target.closest("[data-pf]");
  if (pfBtn && S.edit) {
    const deb = $("#e-deb"), fin = $("#e-fin"); const v = pfBtn.dataset.pf;
    const start = validYmd(deb.value) ? deb.value : today(); if (!validYmd(deb.value)) deb.value = start;
    const base = validYmd(fin.value) ? fin.value : start;
    let d = v === "fri" ? addDays(mondayOf(start), 4) : addDays(base, Number(v));
    if (d < start) d = start; fin.value = d; return;
  }
  const dateBtn = ev.target.closest("[data-date]");
  if (dateBtn && S.edit) {
    const v = dateBtn.dataset.date; let d = "";
    if (v === "fri") { const n = new Date(); const add = (5 - n.getDay() + 7) % 7; d = addDays(today(), add); }
    else if (v !== "") d = addDays(today(), Number(v));
    $("#e-ech").value = d; return;
  }
  const edBtn = ev.target.closest("[data-ed]");
  if (edBtn && S.edit && S.canWrite !== false) {
    readEditorInputs();
    const f = edBtn.dataset.ed; let v = edBtn.dataset.v;
    if (f === "jour") { const n = Number(v), j = S.edit.jours || []; S.edit.jours = j.includes(n) ? j.filter(x => x !== n) : [...j, n]; renderEditor(); return; }
    if (f === "urgent" || f === "important") v = v === "true";
    S.edit[f] = (S.edit[f] === v && (f === "priorite" || f === "urgent" || f === "important")) ? (f === "priorite" ? "" : null) : v;
    if (f === "statut" && v === "Terminé" && !validYmd(S.edit.cloture)) S.edit.cloture = today();
    renderEditor(); return;
  }
  const a = ev.target.closest("[data-act]");
  if (!a) return;
  const act = a.dataset.act;
  const id = a.closest("[data-id]")?.dataset.id;
  if (/^(ao|bib|pick|wz|bd)-/.test(act)) { aoAction(act, a, ev); return; }
  if (act.startsWith("dec-")) { if (act === "dec-refs-save") decRefsSave(); else decAction(act, a); return; }
  if (await planClick(act, a, id, ev)) return;
  if (act.startsWith("tip-")) { tipAction(act, a); return; }
  if (act === "edit" && id && wantsSheet() && !dragMoved && !S.edit && !a.closest(".tip-sheet")) { openTipSheet(a.closest("[data-id]")); return; }
  if (act === "close-ed") { if (ev.target === a || a.tagName === "BUTTON") closeEditor(); return; }
  if (act === "edit" && id) { if (dragMoved) return; openEditor(id); return; }
  if (act === "new") { openEditor(null, {projet: a.dataset.proj}); return; }
  if (act.startsWith("plan-") || act === "goweek") { planAction(act, a, id); return; }
  if (act === "done" && id) { toggleDone(id); return; }
  if (act === "setq" && id) { setQuad(id, a.dataset.q); return; }
  if (act === "save") { saveEditor(); return; }
  if (act === "delete") {
    if (!S.delArmed) { readEditorInputs(); S.delArmed = true; renderEditor(); return; }
    const tid = S.edit.id; closeEditor();
    try { await S.db.doc("tasks/" + tid).delete(); toast("Tâche supprimée"); } catch (e) { fail(e); } return;
  }
  if (act === "archive-one") { readEditorInputs(); const t = S.edit; t.archived = !t.archived; closeEditor(); try { await saveTask(t); toast(t.archived ? "Tâche archivée" : "Tâche désarchivée"); } catch (e) { fail(e); } return; }
  if (act === "clear-filters") { S.f.projets = []; S.f.statuts = []; S.f.quads = []; S.f.q = ""; const s = $("#t-search"); if (s) s.value = ""; saveUi(); updateTaches(); return; }
  if (act === "list-del") { const k = a.dataset.list, v = a.dataset.val; saveLists({...S.lists, [k]: S.lists[k].filter(x => x !== v)}); render(true); return; }
  if (act === "import") { $("#imp-file").click(); return; }
  if (act === "export-xlsx") { doExport("xlsx"); return; }
  if (act === "export-csv") { doExport("csv"); return; }
  if (act === "export-json") { doBackup(); return; }
  if (act === "logout") { if (window.TODO_ACCOUNT) window.TODO_ACCOUNT.signOut(); return; }
  if (act === "archive") {
    const old = live().filter(t => isDone(t) && validYmd(t.cloture) && diffDays(today(), t.cloture) > 30).map(t => t.id);
    try { await runPool(old, tid => S.db.doc("tasks/" + tid).update({archived:true, updated: nowIso()})); toast(`${old.length} tâche(s) archivée(s)`); } catch (e) { fail(e); }
    render(true); return;
  }
});
$("#fab").addEventListener("click", () => openEditor(null, {projet: S.view === "jour" ? S.jourProjet : S.view === "matrice" ? S.matProjet : S.view === "planning" ? S.plan.proj : (S.f.projets.length === 1 ? S.f.projets[0] : "")}));
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape") document.querySelectorAll(".ao-pick,.copybox").forEach(x => x.remove());
  if (ev.key === "Enter" && ev.target.dataset && (ev.target.dataset.ao || ev.target.dataset.bib) && /INPUT|TEXTAREA/.test(ev.target.tagName)) { ev.preventDefault(); ev.target.blur(); return; }
  if (ev.key === "Enter" && ev.target.dataset && ev.target.dataset.dec && /INPUT|TEXTAREA/.test(ev.target.tagName)) { ev.preventDefault(); ev.target.blur(); return; }
  if (ev.key === "Escape" && S.edit) closeEditor();
  if (S.edit && ev.key === "Enter" && (ev.metaKey || ev.ctrlKey)) saveEditor();
  if (!S.edit && ev.key === "n" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || "") && S.status === "ready" && S.canWrite !== false) { ev.preventDefault(); openEditor(null); }
  if (!S.edit && ev.key === "/" && S.view === "taches" && document.activeElement?.id !== "t-search") { ev.preventDefault(); $("#t-search")?.focus(); }
});
let searchT = 0;
document.addEventListener("input", ev => {
  if (ev.target.id === "e-av") { const l = $("#e-av-v"); if (l) l.textContent = ev.target.value + " %"; }
  if (ev.target.id === "t-search") { clearTimeout(searchT); searchT = setTimeout(() => { S.f.q = ev.target.value; updateTaches(); }, 120); }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.dataset && t.dataset.dec) { decChange(t); return; }
  if (t.dataset && t.dataset.ao) { aoChange(t); return; }
  if (t.dataset && t.dataset.bib) { uoChange(t); return; }
  if (t.id === "dec-imp-file" && t.files && t.files[0]) { decImportPreview(t.files[0]); t.value = ""; return; }
  if (t.id === "dec-upto") { S.dec.upto = t.checked; saveDecUi(); render(true); return; }
  if (decSettingsChange(t)) return;
  if (t.id === "t-sort") { S.f.sort = t.value; saveUi(); updateTaches(); }
  if (t.id === "t-hide") { S.f.hideDone = t.checked; saveUi(); updateTaches(); }
  if (t.id === "t-arch") { S.f.showArch = t.checked; saveUi(); updateTaches(); }
  if (t.id === "p-we") { S.plan.weekend = t.checked; saveUi(); render(true); }
  if (t.id === "p-done") { S.plan.showDone = t.checked; saveUi(); render(true); }
  if (t.classList && t.classList.contains("set-capd")) {
    const n = parseFloat(String(t.value).replace(",", ".")), k = t.dataset.d;
    if (isFinite(n) && n >= 0 && n <= 24) { const caps = {...capsAll(), [k]:Math.round(n * 100) / 100}; savePrefs({caps}); toast(`${JOURS[k].charAt(0).toUpperCase() + JOURS[k].slice(1)} : ${hfmt(n)} h disponibles`); render(true); }
    else t.value = hfmt(capsAll()[k]);
  }
  if (t.id === "set-h0" || t.id === "set-h1") { const n = parseInt(t.value, 10); const k = t.id === "set-h0" ? "h0" : "h1"; if (n >= 0 && n <= 24) { S.plan[k] = n; savePrefs({[k]:n}); saveUi(); toast(`Journée : ${dayRange()[0]} h – ${dayRange()[1]} h`); } else t.value = dayRange()[k === "h0" ? 0 : 1]; }
  if (t.id === "set-cap") { const n = parseFloat(String(t.value).replace(",", ".")); if (isFinite(n) && n > 0 && n <= 24) { S.plan.cap = n; saveUi(); toast(`Capacité : ${hfmt(n)} h par jour`); } else t.value = hfmt(capDay()); }
  if (t.id === "imp-file" && t.files && t.files[0]) { importFile(t.files[0]); t.value = ""; }
  if (t.id === "e-ech" && S.edit) S.edit.echeance = t.value;
});
document.addEventListener("submit", async ev => {
  ev.preventDefault();
  const form = ev.target;
  if (form.id === "quick") {
    const inp = $("#qa-text"), txt = inp.value.trim(); if (!txt) return;
    const projet = $("#qa-proj")?.value || "";
    inp.value = "";
    try { await saveTask({id:null, projet, tache:txt, statut:"À faire", priorite:"", urgent:null, important:null, echeance:"", responsable:S.lists.responsables[0] || "", theme:"", type:"", cloture:"", commentaires:""}); toast("Ajoutée à " + (projet || "la liste")); } catch (e) { fail(e); }
    inp.focus(); return;
  }
  const lk = form.dataset.listForm;
  if (lk) { const inp = form.querySelector("input"); const v = inp.value.trim(); if (!v || S.lists[lk].includes(v)) { inp.value = ""; return; }
    inp.value = ""; inp.blur(); await saveLists({...S.lists, [lk]: [...S.lists[lk], v]}); render(true); }
});

/* Glisser-déposer (Matrice) */
let dragId = null, dragMoved = false;
document.addEventListener("dragstart", ev => { const c = ev.target.closest?.(".card"); if (!c) return; dragId = c.dataset.id; dragMoved = true; c.classList.add("dragging"); try { ev.dataTransfer.setData("text/plain", dragId); ev.dataTransfer.effectAllowed = "move"; } catch (e) {} });
document.addEventListener("dragend", ev => { ev.target.closest?.(".card")?.classList.remove("dragging"); document.querySelectorAll(".quad.over").forEach(q => q.classList.remove("over")); dragId = null; setTimeout(() => { dragMoved = false; }, 50); });
document.addEventListener("dragover", ev => { const q = ev.target.closest?.(".quad[data-quad]"); if (!q || !dragId || q.dataset.quad === "—") return; ev.preventDefault(); document.querySelectorAll(".quad.over").forEach(x => x !== q && x.classList.remove("over")); q.classList.add("over"); });
document.addEventListener("drop", ev => { const q = ev.target.closest?.(".quad[data-quad]"); if (!q || !dragId) return; ev.preventDefault(); q.classList.remove("over"); if (q.dataset.quad !== "—") setQuad(dragId, q.dataset.quad); });

/* ---------- Démarrage ---------- */
async function init(){
  route();
  const use = window.claude && window.claude.use ? window.claude.use.bind(window.claude) : null;
  const db = use ? await use("db") : null;
  if (!db) { S.status = "nodb"; render(true); return; }
  S.db = db;
  const timer = setTimeout(() => { if (!S.confirmed) { S.slow = true; render(); } }, 10000);
  db.collection("tasks").onSnapshot(snap => {
    S.tasks = new Map(snap.docs.map(d => [d.id, {id:d.id, ...d.data()}]));
    if (S.status === "loading") { S.status = "ready"; S.built = null; }
    if (!snap.metadata.fromCache) { S.confirmed = true; S.slow = false; clearTimeout(timer); }
    schedule();
  }, err => { clearTimeout(timer); S.status = "error"; S.error = err && err.code; render(true); });
  db.doc("meta/prefs").onSnapshot(s => { S.prefs = (s.exists && s.data()) || {}; schedule(); }, () => {});
  db.collection("ao").onSnapshot(snap => { S.aos = new Map(snap.docs.map(d => [d.id, {...d.data(), id:d.id}])); if (S.view === "chiffrage") schedule(); }, () => {});
  db.doc("meta/societes").onSnapshot(s => { S.socs = (s.exists && s.data()) || null; if (S.view === "chiffrage") schedule(); }, () => {});
  db.doc("meta/uo").onSnapshot(s => { S.uo = (s.exists && s.data()) || null; if (S.view === "chiffrage") schedule(); }, () => {});
  db.collection("decompte").onSnapshot(snap => { S.decDocs = Object.fromEntries(snap.docs.map(d => [d.id, d.data()])); if (S.view === "heures") schedule(); }, () => {});
  db.doc("meta/lists").onSnapshot(s => {
    const d = (s.exists && s.data()) || {};
    S.lists = {projets: Array.isArray(d.projets) ? d.projets : [], responsables: Array.isArray(d.responsables) ? d.responsables : [], types: Array.isArray(d.types) ? d.types : [], _perso: Array.isArray(d._perso) ? d._perso : [], projVis: d.projVis || {}};
    S.listsLoaded = true;
    if (S.view === "taches") S.built = null;
    schedule();
  }, () => {});
  const user = use ? await use("user") : null;
  if (user) { try { const w = await user.can("data.write"); if (w === false) { S.canWrite = false; render(true); } } catch (e) {} }
}
setInterval(() => { if (S.status === "ready" && !S.edit) render(); }, 60000);
init();
})();
</script>
